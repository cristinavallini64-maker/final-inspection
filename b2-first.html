<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2 First</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; font-family: 'Nunito', sans-serif; color: #eee; }

  .hero { background: #FF0000; padding: 40px 40px 32px; display: flex; align-items: center; gap: 26px; }
  .hero-letter { font-family: 'Bebas Neue', sans-serif; font-size: 7rem; color: #000; line-height: 1; flex-shrink: 0; }
  .hero-text h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 3px; color: #000; }
  .hero-text p { font-size: 1rem; color: #111; margin-top: 4px; font-weight: 700; }

  .main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 60px; }
  #app { font-size: 1.08rem; }
  .btn { display: inline-block; border: none; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 900; border-radius: 20px; padding: 8px 20px; font-size: 0.95rem; text-decoration: none; transition: all 0.2s; }
  .btn-red { background: #FF0000; color: #000; }
  .btn-cyan { background: #00CFCF; color: #000; }
  .btn-green { background: #00CC44; color: #000; }
  .btn-ghost { background: #222; color: #eee; }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .topbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }

  .block-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 4px; padding: 10px 22px; border-radius: 8px; margin: 10px 0 16px; display: inline-block; color: #000; }
  .bt-red { background: #FF0000; } .bt-cyan { background: #00CFCF; } .bt-green { background: #00CC44; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-bottom: 30px; }
  .card { border-radius: 14px; padding: 18px 20px; color: #000; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.5); transition: transform 0.2s; display: flex; flex-direction: column; gap: 8px; }
  .card:hover { transform: translateY(-4px); }
  .card.off { opacity: 0.45; cursor: not-allowed; }
  .card.off:hover { transform: none; }
  .c-red { background: #FF0000; } .c-cyan { background: #00CFCF; } .c-green { background: #00CC44; }
  .card-name { font-weight: 900; font-size: 1.1rem; }
  .card-sub { font-size: 0.85rem; font-weight: 700; }
  .badge { align-self: flex-start; background: rgba(0,0,0,0.25); border-radius: 10px; padding: 3px 10px; font-size: 0.78rem; font-weight: 900; }

  .divider { height: 4px; border-radius: 4px; margin: 8px 0 30px; background: linear-gradient(90deg, #00CFCF, #FF0000, #00CC44); }

  .rubric { background: #1a1a1a; border-left: 6px solid #FF0000; border-radius: 8px; padding: 14px 18px; margin-bottom: 22px; }
  .rubric .en { font-weight: 700; font-size: 1.02rem; }
  .rubric .it { font-size: 0.9rem; color: #bbb; margin-top: 6px; }
  .sec-reading .rubric { border-left-color: #00CFCF; }
  .sec-listening .rubric { border-left-color: #00CC44; }

  .textbox { background: #f4f1e8; color: #111; border-radius: 10px; padding: 18px 22px; margin-bottom: 18px; line-height: 1.65; font-size: 1.02rem; }
  .textbox h3 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; font-size: 1.5rem; margin-bottom: 8px; }
  .textbox p { margin-bottom: 10px; }
  .notice { background: #fffbe0; color: #111; border: 2px solid #333; border-radius: 8px; padding: 12px 16px; margin: 8px 0 12px; line-height: 1.5; white-space: pre-line; }

  .q { background: #181818; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; border: 2px solid transparent; }
  .q.ok { border-color: #00CC44; } .q.ko { border-color: #FF0000; }
  .q-head { font-weight: 900; margin-bottom: 8px; }
  .q-num { display: inline-block; background: #FF0000; color: #000; border-radius: 6px; padding: 0 8px; margin-right: 8px; }
  .sec-reading .q-num { background: #00CFCF; } .sec-listening .q-num { background: #00CC44; }
  .q-context { font-size: 0.9rem; color: #aaa; margin-bottom: 6px; font-style: italic; }
  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .opt:hover { background: #242424; }
  .opt input { margin-top: 4px; accent-color: #FF0000; }
  .opt b { min-width: 18px; }
  .opt img { max-width: 260px; border-radius: 6px; background: #fff; }
  .qimg { display: block; max-width: 100%; width: 720px; background: #fff; border-radius: 8px; margin: 6px 0 10px; }
  .notice img { width: 520px; max-width: 100%; }
  .fb { margin-top: 6px; font-weight: 900; font-size: 0.92rem; }
  .fb.ok { color: #00CC44; } .fb.ko { color: #ff5555; }

  select, input.gap { font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 700; border: 2px solid #333; border-radius: 6px; padding: 2px 6px; background: #fff; color: #000; }
  input.gap { width: 140px; }
  .gapwrap { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .gapnum { font-weight: 900; font-size: 0.8rem; background: #111; color: #fff; border-radius: 4px; padding: 0 5px; }
  .gapwrap.ok select, .gapwrap.ok input { border-color: #00CC44; background: #e6ffed; }
  .gapwrap.ko select, .gapwrap.ko input { border-color: #FF0000; background: #ffe6e6; }
  .gapfix { font-weight: 900; color: #c00; font-size: 0.85rem; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } .hero { padding: 28px 16px; } .hero-letter { font-size: 4.5rem; } .hero-text h1 { font-size: 2.2rem; } }
  .mtext { background: #f4f1e8; color: #111; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; line-height: 1.5; font-size: 0.95rem; }
  .mtext b { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 1px; margin-right: 6px; }
  .optlist { background: #1c1c1c; border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; line-height: 1.6; }
  .optlist div { margin-bottom: 4px; }

  .audiobox { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 10px; }
  .plays { font-size: 0.85rem; font-weight: 700; color: #aaa; }
  .transcript { display: none; background: #222; border-radius: 8px; padding: 10px 14px; margin-top: 8px; white-space: pre-line; font-size: 0.9rem; line-height: 1.5; color: #ddd; }
  .transcript.show { display: block; }
  .tbtn { background: none; border: 1px solid #555; color: #ccc; border-radius: 14px; padding: 3px 12px; font-size: 0.8rem; cursor: pointer; margin-top: 6px; }

  .resultbar { position: sticky; bottom: 0; background: #0d0d0d; padding: 14px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-top: 2px solid #222; margin-top: 10px; }
  .score { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 2px; }
  .empty-note { background: #1a1a1a; border-radius: 10px; padding: 18px; color: #bbb; }
  .tf-line { line-height: 2; }
  .tf-line input.gap { width: 220px; max-width: 100%; }
  .notice img { display: block; }
  .longwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .textcol { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow-y: auto; border-radius: 10px; }
  .textcol .textbox { margin-bottom: 0; }
  .two-col > div:last-child { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow-y: auto; }
  @media (max-width: 860px) {
    .longwrap { grid-template-columns: 1fr; }
    .textcol, .two-col > div:last-child { position: static; max-height: none; }
  }
  .pill input { display: none; }
  .pill span { display: inline-block; padding: 6px 14px; border-radius: 16px; background: #2a2a2a; color: #eee; font-weight: 900; cursor: pointer; }
  .pill input:checked + span { background: #FF0000; color: #000; }
  .wt-band { margin: 8px 0 4px; font-size: 1.15rem; color: #fff; }
  .wt-band b { color: #FF0000; }
  .wt-ver { color: #555; font-size: 0.75rem; margin: -6px 0 10px; }
  .wt-choice { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .wt-area { width: 100%; min-height: 220px; background: #000; color: #fff; border: 1px solid #333; border-radius: 10px; padding: 14px; font-family: 'Nunito', sans-serif; font-size: 1rem; line-height: 1.5; resize: vertical; }
  .wt-area:focus { outline: none; border-color: #FF0000; }
  .wt-meta { display: flex; justify-content: space-between; color: #888; font-size: 0.85rem; font-weight: 800; margin: 6px 0 12px; }
  .wt-err { display: none; margin-top: 14px; padding: 12px; background: rgba(255,0,0,0.15); border: 1px solid #ff4444; border-radius: 8px; color: #ff6666; font-weight: 700; }
  .wt-res { display: none; margin-top: 18px; padding: 20px; background: #000; border-left: 4px solid #FF0000; border-radius: 8px; line-height: 1.7; }
  .wt-res h3 { margin: 10px 0 6px; color: #FF0000; }
  .wt-res ul { margin-left: 20px; }
  .btn-yellow { background: #FFD400; color: #000; }
  .bt-yellow { background: #FFD400; } .c-yellow { background: #FFD400; }
  .sec-useofenglish .rubric { border-left-color: #FFD400; } .sec-useofenglish .q-num { background: #FFD400; }
  .stem { font-weight: 900; font-size: 0.78rem; letter-spacing: 1px; color: #7a5a00; }
  .kw { display: inline-block; background: #FFD400; color: #000; font-weight: 900; letter-spacing: 1px; border-radius: 5px; padding: 0 8px; margin: 4px 0 6px; }
  .sect { margin-bottom: 14px; } .sect h4 { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 1px; margin-bottom: 4px; }
  .wt-res { white-space: normal; }
  .fb:empty { display: none; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-letter">B2</div>
  <div class="hero-text">
    <h1>B2 First</h1>
    <p>Reading · Writing · Use of English · Listening — Certificazioni</p>
  </div>
</div>

<div class="main" id="app"></div>

<script>
/* =====================================================================
   ELENCO DEI TEST
   ---------------------------------------------------------------------
   Ogni test ha il suo file nella cartella tests/ del repo (es. tests/fce1-t1.js),
   creato con editor-b2.html: non serve modificare questo file.
   Per aggiungere un libro nuovo basta aggiungere qui 4 righe come queste.
   ===================================================================== */
window.TESTDATA = window.TESTDATA || {};

const TESTS = [

/* ---- Cambridge FCE 1 (formato 2008) ---- */
{ id:'fce1-t1', title:'Cambridge FCE 1 · Test 1', src:'tests/fce1-t1.js' },
{ id:'fce1-t2', title:'Cambridge FCE 1 · Test 2', src:'tests/fce1-t2.js' },
{ id:'fce1-t3', title:'Cambridge FCE 1 · Test 3', src:'tests/fce1-t3.js' },
{ id:'fce1-t4', title:'Cambridge FCE 1 · Test 4', src:'tests/fce1-t4.js' }

];

/* =====================================================================
   MOTORE — non serve modificarlo
   ===================================================================== */
const MAX_PLAYS = 2;            // ascolti consentiti prima della correzione
const SAVE_KEY = 'b2first_v2';
const L = 'ABCDEFGH';
const SECTIONS = [['reading', '📖 Reading', 'cyan'], ['writing', '✍️ Writing', 'red'], ['useofenglish', '🧩 Use of English', 'yellow'], ['listening', '🎧 Listening', 'green']];
const SEC_NAME = { reading: 'Reading', writing: 'Writing', useofenglish: 'Use of English', listening: 'Listening' };
const SEC_COL = { reading: 'cyan', writing: 'red', useofenglish: 'yellow', listening: 'green' };

const FORMATS = {
  '2008': {
    reading: {
      1: { opts: 4, type: 'mclong', info: 'Multiple choice', en: 'You are going to read a text. For questions 1–8, choose the answer (A, B, C or D) which you think fits best according to the text.', it: 'Le domande seguono l\'ordine del testo. Cerca il punto preciso e scarta le opzioni che il testo non dice davvero.' },
      2: { type: 'gapped', info: 'Gapped text', en: 'Seven sentences have been removed from the text. Choose from the sentences A–H the one which fits each gap (9–15). There is one extra sentence which you do not need to use.', it: 'Guarda la frase prima e quella dopo il buco: pronomi (it, they, this), connettivi e ripetizioni ti dicono quale frase va lì.' },
      3: { type: 'matching', info: 'Multiple matching', en: 'For questions 16–30, choose from the people or sections. They may be chosen more than once.', it: 'Leggi prima le domande, poi cerca nel testo le parafrasi: raramente le parole sono le stesse.' }
    },
    writing: {
      1: { type: 'writetask', info: 'Letter or email', en: 'You must answer this question. Write your answer in 120–150 words in an appropriate style.', it: 'Devi usare TUTTI gli appunti della consegna: ognuno è un punto di contenuto.' },
      2: { type: 'writetask', info: 'Choice of task', choice: true, en: 'Write an answer to one of the questions in this part. Write your answer in 120–180 words in an appropriate style.', it: 'Scegli una sola domanda. Rispetta il tipo di testo (lettera, articolo, recensione, storia, report, essay) e il lettore.' }
    },
    useofenglish: {
      1: { type: 'mccloze', info: 'Multiple-choice cloze', en: 'For questions 1–12, read the text below and decide which answer (A, B, C or D) best fits each gap.', it: 'Conta la parola che va con quelle intorno: collocazioni, preposizioni, phrasal verbs.' },
      2: { type: 'opencloze', info: 'Open cloze', en: 'For questions 13–24, read the text below and think of the word which best fits each gap. Use only one word in each gap.', it: 'Manca quasi sempre una parola grammaticale: preposizione, ausiliare, pronome, articolo, connettivo.' },
      3: { type: 'wordform', info: 'Word formation', en: 'For questions 25–34, read the text below. Use the word given in capitals to form a word that fits in the gap.', it: 'Chiediti prima che parte del discorso serve (nome, aggettivo, avverbio), se va al plurale o al negativo (un-, in-, dis-).' },
      4: { type: 'kwt', info: 'Key word transformation', en: 'For questions 35–42, complete the second sentence so that it has a similar meaning to the first sentence, using the word given. Do not change the word given. You must use between two and five words, including the word given.', it: 'Ogni frase vale 2 punti: uno per ciascuna metà della risposta. La parola data non si cambia.' }
    },
    listening: {
      1: { opts: 3, type: 'mcaudio', info: 'Short extracts', en: 'You will hear people talking in eight different situations. For questions 1–8, choose the best answer (A, B or C).', it: 'Leggi la domanda prima di ascoltare: spesso si sentono tutte e tre le opzioni.' },
      2: { type: 'notes', info: 'Sentence completion', en: 'For questions 9–18, complete the sentences.', it: 'Scrivi le parole che senti, senza riformularle. L\'ortografia conta.' },
      3: { type: 'speakers', info: 'Multiple matching', en: 'You will hear five different people. For questions 19–23, choose from the list (A–F). Use the letters only once. There is one extra letter which you do not need to use.', it: 'Ognuno parla dello stesso tema: ascolta l\'idea generale di ciascuno, non una singola parola.' },
      4: { opts: 3, type: 'mclong', info: 'Multiple choice', en: 'For questions 24–30, choose the best answer (A, B or C).', it: 'Le domande seguono l\'ordine dell\'intervista.' }
    }
  }
};
function spec(t, sec, p) { const f = FORMATS[t.format || '2008'] || FORMATS['2008']; return (f[sec] && f[sec][p.part]) || { type: '', info: '', en: '', it: '' }; }

/* ---------- salvataggio ---------- */
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
function storeBest(key, score, total) {
  try {
    const s = loadSave();
    if (!s[key] || score > s[key].score) s[key] = { score, total };
    localStorage.setItem(SAVE_KEY, JSON.stringify(s));
  } catch (e) {}
}

/* ---------- utilità ---------- */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function norm(s) {
  return String(s).toLowerCase().replace(/[’‘`]/g, "'")
    .replace(/\bcan't\b/g, 'cannot').replace(/\bwon't\b/g, 'will not').replace(/n't\b/g, ' not')
    .replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will').replace(/'m\b/g, ' am').replace(/'d\b/g, ' would')
    .replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
}
/* risposte del libro: "travel agent('s) / travel agency" -> tutte le forme; le parentesi sono facoltative */
function expandAlts(str) {
  const out = [];
  String(str || '').split(/\s+\/\s+/).forEach(ph => {
    (function rec(s) {
      const m = s.match(/\(([^()]*)\)/);
      if (!m) { const c = s.replace(/\s+/g, ' ').trim(); if (c && !out.includes(c)) out.push(c); return; }
      rec(s.slice(0, m.index) + m[1] + s.slice(m.index + m[0].length));
      rec(s.slice(0, m.index) + s.slice(m.index + m[0].length));
    })(ph);
  });
  return out;
}
function allAlts(list) { return [].concat(...(list || []).map(expandAlts)); }
function sameText(given, alts) {
  const g = norm(given); if (!g) return false;
  return alts.some(a => norm(a) === g || norm(a).replace(/ /g, '') === g.replace(/ /g, ''));
}
/* key word transformation: "in order | not to" (OR separa soluzioni diverse); 2 punti, uno per metà */
function kwtScore(given, keys) {
  const g = norm(given); if (!g) return 0;
  let best = 0;
  keys.forEach(k => k.split(/\s+OR\s+/).forEach(opt => {
    const [a, b] = opt.split('|').map(x => expandAlts(x).map(norm));
    if (!b) { if (a.includes(g)) best = 2; return; }
    if (a.some(x => b.some(y => (x + ' ' + y).trim() === g))) { best = 2; return; }
    const p1 = a.some(x => g === x || g.startsWith(x + ' ')), p2 = b.some(y => g === y || g.endsWith(' ' + y));
    best = Math.max(best, p1 || p2 ? 1 : 0);
  }));
  return best;
}
function kwtShow(k) { const o = k.split(/\s+OR\s+/)[0].split('|').map(x => expandAlts(x).sort((p, q) => p.length - q.length)[0] || ''); return o.join(' ').trim(); }
function paras(text, gapFn) {
  return String(text || '').trim().split(/\n\s*\n/).map(p => {
    let h = esc(p).replace(/\n/g, '<br>');
    if (gapFn) h = h.replace(/\[\s*\[(\d+)\]\s*\]|\[(\d+)\]/g, (m, a, b) => gapFn(+(a || b)));   /* accetta [9] e [[9]] */
    return '<p>' + h + '</p>';
  }).join('');
}
function titleBox(p, inner) { return `<div class="textbox">${p.title ? `<h3>${esc(p.title)}</h3>` : ''}${inner}</div>`; }
function optLabel(o) { return (o && typeof o === 'object' && o.img) ? `<img src="${esc(o.img)}" alt="">` : esc(o); }
/* una parte è "pronta" quando contiene almeno un testo */
function filled(p) {
  let found = false;
  (function walk(o) {
    if (found || !o || typeof o !== 'object') return;
    for (const k in o) {
      const v = o[k];
      if (['text', 'q', 'name', 'first', 'notes', 'img', 'task'].includes(k) && typeof v === 'string' && v.trim()) { found = true; return; }
      if (typeof v === 'object') walk(v);
    }
  })(p);
  return found;
}
function readyParts(t, sec) { return (t[sec] || []).filter(filled); }

/* ---------- audio ---------- */
let plays = {}, checked = false, player = new Audio(), audioReg = {};
function stopAudio() { try { player.pause(); } catch (e) {} }
function audioHTML(id, src) {
  if (!src) return '';
  audioReg[id] = src;
  plays[id] = plays[id] || 0;
  return `<div class="audiobox"><button class="btn btn-green" id="ab-${id}" onclick="playAudio('${id}')">▶ Ascolta</button>
    <button class="btn btn-ghost" onclick="stopAudio()">⏸ Pausa</button>
    <span class="plays" id="pl-${id}">Ascolti: ${plays[id]}/${MAX_PLAYS}</span></div>`;
}
function refreshAudio(id) {
  const b = document.getElementById('ab-' + id), p = document.getElementById('pl-' + id);
  if (p) p.textContent = checked ? 'Ascolto libero' : `Ascolti: ${plays[id]}/${MAX_PLAYS}`;
  if (b) b.disabled = !checked && plays[id] >= MAX_PLAYS;
}
function playAudio(id) {
  const src = audioReg[id]; if (!src) return;
  if (player.dataset.id === id && player.paused && player.currentTime > 0 && !player.ended) { player.play(); return; }  /* ripresa dopo la pausa: non conta come nuovo ascolto */
  if (!checked && plays[id] >= MAX_PLAYS) return;
  stopAudio();
  if (!checked) plays[id]++;
  refreshAudio(id);
  player.dataset.id = id;
  player.src = src; player.play().catch(() => alert('File audio non trovato: ' + src));
}

/* ---------- navigazione ---------- */
const app = document.getElementById('app');
function hasContent(t) { return SECTIONS.some(([sec]) => readyParts(t, sec).length); }
function countQ(p) {
  if (p.items) return p.items.length;
  if (p.people) return p.people.length;
  if (p.gaps) return Object.keys(p.gaps).length;
  if (p.answers) return Object.keys(p.answers).length;
  return 0;
}

function showHome() {
  stopAudio(); window.scrollTo(0, 0);
  const save = loadSave();
  let h = `<div class="topbar"><a href="javascript:window.close()" class="btn btn-red">✕ Chiudi questa scheda</a></div>
    <div class="block-title bt-red">📚 Scegli il test</div><div class="grid">`;
  TESTS.forEach((t, i) => {
    const on = hasContent(t) || (t.src && !t.loaded && t.exists !== false);
    let done = 0, tot = 0;
    SECTIONS.forEach(([sec]) => readyParts(t, sec).forEach(p => { tot++; if (save[`${t.id}|${sec}|${p.part}`]) done++; }));
    h += `<div class="card c-red ${on ? '' : 'off'}" ${on ? `onclick="go('${t.id}')"` : ''}>
      <div class="card-name">${esc(t.title)}</div>
      ${on ? (tot ? `<span class="badge">${done}/${tot} parti svolte</span>` : '<span class="badge">Apri</span>') : '<span class="badge">in preparazione</span>'}</div>`;
  });
  app.innerHTML = h + '</div>';
  /* controlla quali file dei test esistono già: quelli mancanti risultano "in preparazione" */
  TESTS.filter(t => t.src && !t.loaded && t.exists === undefined).forEach(t => {
    t.exists = null;
    fetch(t.src, { method: 'HEAD', cache: 'no-store' }).then(r => { t.exists = r.ok; if (!r.ok && !location.hash && !new URLSearchParams(location.search).get('test')) showHome(); }).catch(() => { t.exists = true; });
  });
}

function loadTest(t, done) {
  if (!t.src || t.loaded) return done();
  const s = document.createElement('script');
  s.src = t.src + '?v=' + Date.now();
  s.onload = () => { Object.assign(t, window.TESTDATA[t.id] || {}); (t.reading || []).forEach(p => { if (p.questions && !p.items) p.items = p.questions; }); t.loaded = true; done(); };
  s.onerror = () => { t.loaded = true; done(); };
  document.head.appendChild(s);
}
function showTest(ti) {
  stopAudio(); window.scrollTo(0, 0);
  const t = TESTS[ti], save = loadSave();
  let h = `<div class="topbar"><a class="btn btn-ghost" href="final-inspection.html">← Final Inspection</a></div>
    <h2 class="score" style="margin-bottom:10px">${esc(t.title)}</h2>`;
  if (!hasContent(t)) h += '<div class="empty-note">⏳ Questo test è in preparazione.</div>';
  let first = true;
  SECTIONS.forEach(([sec, lab, col]) => {
    const parts = readyParts(t, sec);
    if (!parts.length) return;
    if (!first) h += '<div class="divider"></div>';
    first = false;
    h += `<div class="block-title bt-${col}">${lab}</div><div class="grid">`;
    parts.forEach(p => {
      const b = save[`${t.id}|${sec}|${p.part}`], sp = spec(t, sec, p);
      h += `<div class="card c-${col}" onclick="go('${t.id}/${sec}/${p.part}')">
        <div class="card-name">Part ${p.part}</div><div class="card-sub">${sp.info}${sp.type === 'writetask' ? ' · valutazione IA' : ' · ' + countQ(p) + ' domande'}</div>
        <span class="badge">${b ? `Migliore: ${b.score}/${b.total}` : 'Da fare'}</span></div>`;
    });
    h += '</div>';
  });
  app.innerHTML = h;
}

/* ---------- elementi di risposta ---------- */
let cur = null, keys = [];
function mcQuestion(n, q, options, answer, extra, afterHead) {
  keys.push({ n, kind: 'radio', type: 'letter', v: answer, box: true });
  let h = `<div class="q" id="q-${n}">${extra || ''}<div class="q-head"><span class="q-num">${n}</span>${esc(q || '')}</div>${afterHead || ''}`;
  options.forEach((o, i) => {
    h += `<label class="opt"><input type="radio" name="r-${n}" value="${L[i]}"><b>${L[i]}</b><span>${optLabel(o)}</span></label>`;
  });
  return h + `<div class="fb" id="fb-${n}"></div></div>`;
}
function selectGap(n, letters, answer, labels) {
  keys.push({ n, kind: 'select', type: 'letter', v: answer, label: labels ? labels[letters.indexOf(answer)] : '' });
  let o = '<option value="">—</option>';
  letters.forEach((l, i) => { o += `<option value="${l}">${labels ? l + ' ' + esc(labels[i]) : l}</option>`; });
  return `<span class="gapwrap" id="g-${n}"><span class="gapnum">${n}</span><select id="in-${n}">${o}</select><span class="gapfix" id="fb-${n}"></span></span>`;
}
function textGap(n, answers, stem) {
  keys.push({ n, kind: 'text', type: 'text', v: allAlts(answers) });
  return `<span class="gapwrap" id="g-${n}"><span class="gapnum">${n}</span><input class="gap" id="in-${n}" autocomplete="off" spellcheck="false">${stem ? `<span class="stem">${esc(stem)}</span>` : ''}<span class="gapfix" id="fb-${n}"></span></span>`;
}
function selectQuestion(n, head, letters, answer, extra) {
  keys.push({ n, kind: 'select', type: 'letter', v: answer, box: true });
  let o = '<option value="">—</option>'; letters.forEach(l => o += `<option value="${l}">${l}</option>`);
  return `<div class="q" id="q-${n}" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between">
    <div class="q-head" style="margin:0"><span class="q-num">${n}</span>${esc(head || '')}</div>
    <span class="gapwrap" id="g-${n}"><select id="in-${n}">${o}</select></span>${extra || ''}<div class="fb" id="fb-${n}" style="width:100%;margin:0"></div></div>`;
}

/* ---------- writing: consegna + testo + tutor IA B2 (stesso Worker della pagina I) ---------- */
const WT_URL = 'https://writingtutor.cristinavallini64.workers.dev/';
const WT_KIND = { letter: 'Letter', email: 'Email', article: 'Article', essay: 'Essay', report: 'Report', review: 'Review', story: 'Story' };
function wtInfo(part, kind) {
  return part === 1 ? { name: (WT_KIND[kind] || 'Letter') + ' (B2 First, Writing Part 1, compulsory task)', min: 120, max: 150, target: '120 - 150 parole' }
                    : { name: (WT_KIND[kind] || 'Text') + ' (B2 First, Writing Part 2)', min: 120, max: 180, target: '120 - 180 parole' };
}
async function wtCall(prompt, onRetry) {
  for (let i = 0; i < 2; i++) {
    try {
      const r = await fetch(WT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
      const data = await r.json().catch(() => ({}));
      if (r.ok && !data.error && data.result) return data;
      const msg = data.error || ('Errore del server (' + r.status + ')');
      if (i < 1 && (/high demand|overloaded|unavailable|try again|rate|quota|429|503/i.test(msg) || r.status >= 500 || r.status === 429)) { onRetry && onRetry(i + 1); await new Promise(z => setTimeout(z, 3000)); continue; }
      throw new Error(msg);
    } catch (e) { if (i >= 1 || !/fetch|network/i.test(e.message)) throw e; onRetry && onRetry(i + 1); await new Promise(z => setTimeout(z, 3000)); }
  }
}
function wtMsg(m) { return /high demand|overloaded|unavailable|try again|rate|quota|429|503/i.test(m) ? 'Il servizio di correzione in questo momento è molto occupato. Il tuo testo non è perso: riprova tra qualche minuto.' : 'Errore durante la richiesta: ' + m; }
function wtWords(s) { return s.trim() ? s.trim().split(/\s+/).length : 0; }
function renderWriting(t, p, sp) {
  let h = '';
  if (sp.choice && p.items.length > 1) {
    h += '<div class="wt-choice">' + p.items.map((it, i) => `<label class="pill"><input type="radio" name="wtpick" value="${i}" ${i === 0 ? 'checked' : ''}><span>Question ${it.n} · ${WT_KIND[it.kind] || ''}</span></label>`).join('') + '</div>';
  }
  p.items.forEach((it, i) => {
    const info = wtInfo(p.part, it.kind);
    h += `<div class="wt-item" data-i="${i}" ${i ? 'style="display:none"' : ''}>
      <div class="textbox"><h3>Question ${it.n}</h3>${paras(it.task)}${it.img ? `<img src="${esc(it.img)}" alt="" style="max-width:100%;display:block;margin-top:8px">` : ''}</div>
      <textarea class="wt-area" id="wt-text-${i}" placeholder="Write your ${(WT_KIND[it.kind] || 'text').toLowerCase()} here…"></textarea>
      <div class="wt-meta"><span id="wt-count-${i}">Parole: 0</span><span>Target: ${info.target}</span></div>
      <div class="wt-ver">versione tutor: (caricamento…)</div>
      <button class="btn btn-red wt-go" data-i="${i}">✔ Valuta il mio Writing</button>
      <div class="wt-err" id="wt-err-${i}"></div><div class="wt-res" id="wt-res-${i}"></div>
    </div>`;
  });
  return h;
}
function initWriting(p) {
  const ver = () => document.querySelectorAll('.wt-ver').forEach(v => v.textContent = 'versione tutor: ' + (window.WT ? WT.version : '?'));
  if (!window.WT && !document.getElementById('wt-js')) {
    const s = document.createElement('script'); s.id = 'wt-js'; s.src = 'tutor-b2.js?v=' + Date.now(); s.onload = ver;
    document.head.appendChild(s);
  } else ver();
  document.querySelectorAll('input[name="wtpick"]').forEach(r => r.onchange = () =>
    document.querySelectorAll('.wt-item').forEach(d => d.style.display = d.dataset.i === r.value ? '' : 'none'));
  p.items.forEach((it, i) => {
    const ta = document.getElementById('wt-text-' + i), cnt = document.getElementById('wt-count-' + i), info = wtInfo(p.part, it.kind);
    ta.oninput = () => { const n = wtWords(ta.value); cnt.textContent = 'Parole: ' + n; cnt.style.color = n && (n < info.min || n > info.max) ? '#ff6666' : ''; };
  });
  document.querySelectorAll('.wt-go').forEach(b => b.onclick = () => runWT(p, p.items[+b.dataset.i], +b.dataset.i, b));
}
async function runWT(p, it, i, btn) {
  const text = document.getElementById('wt-text-' + i).value.trim(), err = document.getElementById('wt-err-' + i), res = document.getElementById('wt-res-' + i);
  const info = wtInfo(p.part, it.kind), pts = it.points && it.points.length ? it.points : null;
  err.style.display = 'none'; res.style.display = 'none';
  if (!text) { err.textContent = 'Scrivi il tuo testo prima di chiedere la valutazione.'; err.style.display = 'block'; return; }
  if (!window.WT) { err.textContent = 'Il tutor non è ancora caricato: riprova tra un attimo.'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Analisi in corso…';
  try {
    const data = await wtCall(WT.prompt(info, it, text, pts, wtWords(text)), () => { btn.textContent = 'Server occupato, riprovo…'; });
    res.innerHTML = String(data.result).replace(/\*\*/g, '').replace(/(^|<br>)\s*#+\s*/g, '$1'); res.style.display = 'block';
  } catch (e) { err.textContent = wtMsg(e.message); err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = '✔ Valuta il mio Writing'; }
}

/* ---------- rendering delle parti ---------- */
function lettered(list) { return (list || []).map((o, i) => typeof o === 'string' ? { letter: L[i], text: o } : o); }   /* accetta anche frasi senza lettera */
function renderPart(t, sec, p) {
  const sp = spec(t, sec, p), type = sp.type;
  if (p.options && (type === 'gapped' || type === 'speakers')) p.options = lettered(p.options);
  if (p.sections) p.sections = lettered(p.sections);
  let h = '';
  if (sec === 'listening' && p.audio) {
    if (p.intro) h += `<div class="q-context" style="font-size:1rem">${esc(p.intro)}</div>`;
    h += audioHTML('main', p.audio);
  }
  if (type === 'mclong') {
    let qs = ''; p.items.forEach(it => { qs += mcQuestion(it.n, it.q, it.options, it.answer); });
    h += p.text ? `<div class="longwrap"><div class="textcol">${titleBox(p, paras(p.text))}</div><div>${qs}</div></div>` : qs;
  } else if (type === 'gapped') {
    const letters = p.options.map(o => o.letter);
    h += `<div class="longwrap"><div class="textcol">${titleBox(p, paras(p.text, n => selectGap(n, letters, p.answers[n])))}</div>
      <div class="optlist">${p.options.map(o => `<div><b>${o.letter}</b> ${esc(o.text)}</div>`).join('')}</div></div>`;
  } else if (type === 'matching') {
    const letters = p.sections.map(s => s.letter);
    let txt = (p.text ? paras(p.text) : '') + p.sections.map(s => `<div class="sect"><h4>${s.letter}${s.title ? ' · ' + esc(s.title) : ''}</h4>${paras(s.text)}</div>`).join('');
    let qs = p.stem ? `<div class="q-head" style="font-size:1.1rem;margin-bottom:10px">${esc(p.stem)}</div>` : '';
    p.items.forEach(it => { qs += selectQuestion(it.n, it.q, letters, it.answer); });
    h += `<div class="longwrap"><div class="textcol">${titleBox(p, txt)}</div><div>${qs}</div></div>`;
  } else if (type === 'mccloze') {
    h += titleBox(p, paras(p.text, n => { const g = p.gaps[n]; return g ? selectGap(n, g.options.map((_, i) => L[i]), g.answer, g.options) : '[' + n + ']'; }));
  } else if (type === 'opencloze') {
    h += titleBox(p, paras(p.text, n => p.answers[n] ? textGap(n, p.answers[n]) : '[' + n + ']'));
  } else if (type === 'wordform') {
    h += titleBox(p, paras(p.text, n => p.answers[n] ? textGap(n, p.answers[n], (p.stems || {})[n]) : '[' + n + ']'));
  } else if (type === 'kwt') {
    p.items.forEach(it => {
      keys.push({ n: it.n, kind: 'text', type: 'kwt', v: it.answers || [], box: true });
      h += `<div class="q" id="q-${it.n}"><div class="q-head"><span class="q-num">${it.n}</span>${esc(it.first)}</div>
        <div class="kw">${esc((it.key || '').toUpperCase())}</div>
        <div class="tf-line">${esc(it.before || '')} <span class="gapwrap" id="g-${it.n}"><input class="gap" id="in-${it.n}" autocomplete="off" spellcheck="false" style="width:260px"></span> ${esc(it.after || '')}</div>
        <div class="fb" id="fb-${it.n}"></div></div>`;
    });
  } else if (type === 'mcaudio') {
    p.items.forEach(it => {
      const extra = (it.context ? `<div class="q-context">${esc(it.context)}</div>` : '') + audioHTML('a' + it.n, it.audio);
      h += mcQuestion(it.n, it.q, it.options, it.answer, extra);
    });
  } else if (type === 'notes') {
    h += titleBox(p, paras(p.notes, n => p.answers[n] ? textGap(n, p.answers[n]) : '[' + n + ']'));
  } else if (type === 'speakers') {
    const letters = p.options.map(o => o.letter);
    h += `<div class="optlist">${p.options.map(o => `<div><b>${o.letter}</b> ${esc(o.text)}</div>`).join('')}</div>`;
    p.items.forEach(it => { h += selectQuestion(it.n, it.label || ('Speaker ' + (it.n - p.items[0].n + 1)), letters, it.answer); });
  } else if (type === 'writetask') {
    h += renderWriting(t, p, sp);
  }
  return h;
}

function showPart(ti, sec, pi) {
  stopAudio(); window.scrollTo(0, 0);
  checked = false; plays = {}; audioReg = {}; keys = [];
  const t = TESTS[ti], p = t[sec][pi], sp = spec(t, sec, p);
  cur = { ti, sec, pi, t, p };
  let h = `<div class="sec-${sec}"><div class="topbar"><button class="btn btn-ghost" onclick="go('${t.id}')">← ${esc(t.title)}</button></div>
    <div class="block-title bt-${SEC_COL[sec]}">${SEC_NAME[sec]} · Part ${p.part}</div>
    <div class="rubric"><div class="en">${esc(p.rubric || sp.en)}</div><div class="it">💡 ${esc(sp.it)}</div></div>`;
  h += renderPart(t, sec, p);
  const nx = nextPart(t, sec, pi);
  const nextBtn = nx ? `<button class="btn btn-green" onclick="go('${t.id}/${nx[0]}/${nx[1]}')">Parte successiva →</button>` : `<button class="btn btn-ghost" onclick="go('${t.id}')">Torna al test</button>`;
  if (sp.type === 'writetask') { app.innerHTML = h + `<div class="resultbar">${nextBtn}</div></div>`; initWriting(p); return; }
  h += `<div class="resultbar"><button class="btn btn-red" id="checkBtn" onclick="checkPart()">✔ Correggi</button>
    <span class="score" id="scoreOut"></span>
    <button class="btn btn-ghost" id="retryBtn" style="display:none" onclick="showPart(${ti},'${sec}',${pi})">↻ Riprova</button>
    <span id="nextWrap" style="display:none">${nextBtn}</span></div></div>`;
  app.innerHTML = h;
}

/* ---------- correzione ---------- */
function checkPart() {
  let score = 0, tot = 0;
  keys.forEach(k => {
    let given = '';
    if (k.kind === 'radio') { const r = document.querySelector(`input[name="r-${k.n}"]:checked`); given = r ? r.value : ''; }
    else given = document.getElementById('in-' + k.n).value;
    let pts = 0, max = 1;
    if (k.type === 'kwt') { max = 2; pts = kwtScore(given, k.v); }
    else if (k.type === 'text') pts = sameText(given, k.v) ? 1 : 0;
    else pts = given !== '' && String(k.v).split('/').map(x => x.trim()).includes(given) ? 1 : 0;   /* "A/E" = in qualsiasi ordine */
    score += pts; tot += max;
    const ok = pts === max, half = pts > 0 && !ok;
    const gw = document.getElementById('g-' + k.n), qb = document.getElementById('q-' + k.n);
    if (gw) gw.classList.add(ok ? 'ok' : 'ko');
    if (qb) qb.classList.add(ok ? 'ok' : 'ko');
    const fb = document.getElementById('fb-' + k.n);
    if (fb) {
      const sol = k.type === 'kwt' ? kwtShow(k.v[0] || '?') : k.type === 'text' ? (k.v[0] || '?') : String(k.v || '?').replace('/', ' o ') + (k.label ? ' (' + k.label + ')' : '');
      if (k.type === 'kwt') fb.textContent = ok ? '✓ Corretto (2/2)' : (half ? '½ Un punto su due. ' : '✗ ') + 'Risposta corretta: ' + sol;
      else if (k.box) fb.textContent = ok ? '✓ Corretto' : '✗ Risposta corretta: ' + sol;
      else fb.textContent = ok ? '✓' : '→ ' + sol;
      fb.style.color = ok ? '#00a83a' : half ? '#d08000' : '#e00000';
    }
  });
  document.querySelectorAll('#app input, #app select').forEach(el => el.disabled = true);
  checked = true;
  Object.keys(audioReg).forEach(refreshAudio);
  document.getElementById('scoreOut').textContent = `${score}/${tot}`;
  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('retryBtn').style.display = 'inline-block';
  const nw = document.getElementById('nextWrap'); if (nw) nw.style.display = 'inline';
  storeBest(`${cur.t.id}|${cur.sec}|${cur.p.part}`, score, tot);
}

/* ---------- navigazione con indirizzo: indietro del browser e ricarica tornano allo stesso punto ----------
   #fce1-t1                       = pagina del test
   #fce1-t1/useofenglish/3        = una parte del test
   b2-first.html?test=fce1-t1     = link diretto dalla pagina I */
function nextPart(t, sec, pi) {
  const list = [];
  SECTIONS.forEach(([s]) => readyParts(t, s).forEach(p => list.push([s, p.part])));
  const i = list.findIndex(([s, n]) => s === sec && n === t[sec][pi].part);
  return i >= 0 && i < list.length - 1 ? list[i + 1] : null;
}
function go(hash) {
  if (!hash && location.search) { history.pushState(null, '', location.pathname); return route(); }   /* "Tutti i test" dal link ?test=… */
  if (('#' + hash) === location.hash || (!hash && !location.hash)) route();
  else location.hash = hash;
}
function route() {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ''));
  const [id, sec, part] = hash ? hash.split('/') : [new URLSearchParams(location.search).get('test')];
  const ti = TESTS.findIndex(t => t.id === id);
  if (ti < 0) { location.replace('final-inspection.html'); return; }   /* niente elenco generale: si torna alla pagina I */
  const t = TESTS[ti];
  if (t.src && !t.loaded) { app.innerHTML = '<div class="empty-note">Caricamento…</div>'; return loadTest(t, route); }
  if (sec && t[sec]) {
    const pi = t[sec].findIndex(p => String(p.part) === String(part));
    if (pi >= 0) return showPart(ti, sec, pi);
  }
  showTest(ti);
}
window.addEventListener('hashchange', route);
window.addEventListener('popstate', () => { if (!location.hash) route(); });
route();
