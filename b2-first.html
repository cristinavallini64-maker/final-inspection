<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2 First</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; font-family: 'Nunito', sans-serif; color: #eee; }

  .hero { background: #FF0000; padding: 40px 40px 32px; display: flex; align-items: center; gap: 26px; }
  .hero-letter { font-family: 'Bebas Neue', sans-serif; font-size: 7rem; color: #000; line-height: 1; flex-shrink: 0; }
  .hero-text h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 3px; color: #000; }
  .hero-text p { font-size: 1rem; color: #111; margin-top: 4px; font-weight: 700; }

  .main { max-width: 980px; margin: 0 auto; padding: 32px 16px 60px; }
  .btn { display: inline-block; border: none; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 900; border-radius: 20px; padding: 8px 20px; font-size: 0.95rem; text-decoration: none; transition: all 0.2s; }
  .btn-red { background: #FF0000; color: #000; }
  .btn-cyan { background: #00CFCF; color: #000; }
  .btn-green { background: #00CC44; color: #000; }
  .btn-ghost { background: #222; color: #eee; }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .topbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }

  .block-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 4px; padding: 10px 22px; border-radius: 8px; margin: 10px 0 16px; display: inline-block; color: #000; }
  .bt-red { background: #FF0000; } .bt-cyan { background: #00CFCF; } .bt-green { background: #00CC44; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-bottom: 30px; }
  .card { border-radius: 14px; padding: 18px 20px; color: #000; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.5); transition: transform 0.2s; display: flex; flex-direction: column; gap: 8px; }
  .card:hover { transform: translateY(-4px); }
  .card.off { opacity: 0.45; cursor: not-allowed; }
  .card.off:hover { transform: none; }
  .c-red { background: #FF0000; } .c-cyan { background: #00CFCF; } .c-green { background: #00CC44; }
  .card-name { font-weight: 900; font-size: 1.1rem; }
  .card-sub { font-size: 0.85rem; font-weight: 700; }
  .badge { align-self: flex-start; background: rgba(0,0,0,0.25); border-radius: 10px; padding: 3px 10px; font-size: 0.78rem; font-weight: 900; }

  .divider { height: 4px; border-radius: 4px; margin: 8px 0 30px; background: linear-gradient(90deg, #00CFCF, #FF0000, #00CC44); }

  .rubric { background: #1a1a1a; border-left: 6px solid #FF0000; border-radius: 8px; padding: 14px 18px; margin-bottom: 22px; }
  .rubric .en { font-weight: 700; font-size: 1.02rem; }
  .rubric .it { font-size: 0.9rem; color: #bbb; margin-top: 6px; }
  .sec-reading .rubric { border-left-color: #00CFCF; }
  .sec-listening .rubric { border-left-color: #00CC44; }

  .textbox { background: #f4f1e8; color: #111; border-radius: 10px; padding: 18px 22px; margin-bottom: 18px; line-height: 1.65; font-size: 1.02rem; }
  .textbox h3 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; font-size: 1.5rem; margin-bottom: 8px; }
  .textbox p { margin-bottom: 10px; }
  .notice { background: #fffbe0; color: #111; border: 2px solid #333; border-radius: 8px; padding: 12px 16px; margin: 8px 0 12px; line-height: 1.5; white-space: pre-line; }

  .q { background: #181818; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; border: 2px solid transparent; }
  .q.ok { border-color: #00CC44; } .q.ko { border-color: #FF0000; }
  .q-head { font-weight: 900; margin-bottom: 8px; }
  .q-num { display: inline-block; background: #FF0000; color: #000; border-radius: 6px; padding: 0 8px; margin-right: 8px; }
  .sec-reading .q-num { background: #00CFCF; } .sec-listening .q-num { background: #00CC44; }
  .q-context { font-size: 0.9rem; color: #aaa; margin-bottom: 6px; font-style: italic; }
  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .opt:hover { background: #242424; }
  .opt input { margin-top: 4px; accent-color: #00E5FF; }
  .opt b { min-width: 18px; }
  .opt img { max-width: 160px; border-radius: 6px; background: #fff; }
  .fb { margin-top: 6px; font-weight: 900; font-size: 0.92rem; }
  .fb.ok { color: #00CC44; } .fb.ko { color: #ff5555; }

  select, input.gap { font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 700; border: 2px solid #333; border-radius: 6px; padding: 2px 6px; background: #fff; color: #000; }
  input.gap { width: 140px; }
  .gapwrap { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .gapnum { font-weight: 900; font-size: 0.8rem; background: #111; color: #fff; border-radius: 4px; padding: 0 5px; }
  .gapwrap.ok select, .gapwrap.ok input { border-color: #00CC44; background: #e6ffed; }
  .gapwrap.ko select, .gapwrap.ko input { border-color: #FF0000; background: #ffe6e6; }
  .gapfix { font-weight: 900; color: #c00; font-size: 0.85rem; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } .hero { padding: 28px 16px; } .hero-letter { font-size: 4.5rem; } .hero-text h1 { font-size: 2.2rem; } }
  .mtext { background: #f4f1e8; color: #111; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; line-height: 1.5; font-size: 0.95rem; }
  .mtext b { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 1px; margin-right: 6px; }
  .optlist { background: #1c1c1c; border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; line-height: 1.6; }
  .optlist div { margin-bottom: 4px; }

  .audiobox { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 10px; }
  .plays { font-size: 0.85rem; font-weight: 700; color: #aaa; }
  .transcript { display: none; background: #222; border-radius: 8px; padding: 10px 14px; margin-top: 8px; white-space: pre-line; font-size: 0.9rem; line-height: 1.5; color: #ddd; }
  .transcript.show { display: block; }
  .tbtn { background: none; border: 1px solid #555; color: #ccc; border-radius: 14px; padding: 3px 12px; font-size: 0.8rem; cursor: pointer; margin-top: 6px; }

  .resultbar { position: sticky; bottom: 0; background: #0d0d0d; padding: 14px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-top: 2px solid #222; margin-top: 10px; }
  .score { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 2px; }
  .empty-note { background: #1a1a1a; border-radius: 10px; padding: 18px; color: #bbb; }
  .stem { font-weight: 900; letter-spacing: 1px; margin-left: 4px; color: #333; }
  .tf-first { margin-bottom: 6px; line-height: 1.5; }
  .tf-key { display: inline-block; background: #00E5FF; color: #000; font-weight: 900; letter-spacing: 1px; border-radius: 6px; padding: 1px 10px; margin: 4px 0 8px; }
  .tf-line { line-height: 2; }
  .tf-line input.gap { width: 260px; max-width: 100%; }
  .q select { margin-left: 6px; }
</style>
</head>
<body>

<div class="hero" style="background:#00E5FF">
  <div class="hero-letter">B2</div>
  <div class="hero-text">
    <h1>B2 First</h1>
    <p>Reading & Use of English · Listening — Certificazioni</p>
  </div>
</div>

<div class="main" id="app"></div>

<script>
/* =====================================================================
   DATI DEI TEST — è l'unica parte da modificare.
   ---------------------------------------------------------------------
   Ogni test è un oggetto { id, title, reading:[...], listening:[...] }.
   Un test con reading e listening vuoti compare come "in preparazione".
   I testi vanno tra `backtick`: si possono incollare su più righe.
   Una riga vuota = nuovo paragrafo. I buchi si scrivono [1], [9]...
   Risposte scritte: elencare tutte le forme valide, es. ['in spite of','despite'].
   Maiuscole e punteggiatura non contano.

   READING & USE OF ENGLISH
   Part 1 (scelta multipla nel testo):
     { part:1, title:'...', text:`... [1] ...`, gaps:{ 1:{ options:['a','b','c','d'], answer:'B' }, ... } }
   Part 2 (open cloze):
     { part:2, title:'...', text:`... [9] ...`, answers:{ 9:['for'], ... } }
   Part 3 (word formation):
     { part:3, title:'...', text:`... [17] ...`, stems:{ 17:'COMPETE', ... }, answers:{ 17:['competition'], ... } }
   Part 4 (key word transformation):
     { part:4, items:[ { n:25, first:'frase originale', key:'PAROLA',
                         before:'inizio della seconda frase', after:'fine della frase',
                         answers:['risposta 1','variante accettata'] } ] }
   Part 5 (testo lungo + domande a 4 opzioni):
     { part:5, title:'...', text:`...`, items:[ { n:31, q:'...', options:['','','',''], answer:'C' } ] }
   Part 6 (frasi tolte, A–G):
     { part:6, title:'...', text:`... [37] ...`, options:[ { letter:'A', text:'...' } ], answers:{ 37:'D', ... } }
   Part 7 (multiple matching, sezioni A–E):
     { part:7, title:'...', sections:[ { letter:'A', title:'...', text:`...` } ],
       items:[ { n:43, q:'Which person ...?', answer:'B' } ] }

   LISTENING  (audio: percorso del file mp3, es. 'audio/fce1-t1-l1-1.mp3')
   Part 1: { part:1, items:[ { n:1, context:'You hear...', q:'...', audio:'', options:['','',''], answer:'A' } ] }
   Part 2: { part:2, intro:'...', audio:'', notes:`... [9] ...`, answers:{ 9:['...'], ... } }
   Part 3: { part:3, intro:'...', audio:'', options:[ { letter:'A', text:'...' } ],      (A–H)
             items:[ { n:19, label:'Speaker 1', answer:'C' } ] }
   Part 4: { part:4, intro:'...', audio:'', items:[ { n:24, q:'...', options:['','',''], answer:'B' } ] }
   ===================================================================== */

const TESTS = [

/* ---- Libri di past papers: un blocco di 4 test per libro (id: fce1-t1 ... fce1-t4, fce2-t1 ...) ---- */
{ id: 'fce1-t1', title: 'Cambridge FCE 1 · Test 1', reading: [], listening: [] },
{ id: 'fce1-t2', title: 'Cambridge FCE 1 · Test 2', reading: [], listening: [] },
{ id: 'fce1-t3', title: 'Cambridge FCE 1 · Test 3', reading: [], listening: [] },
{ id: 'fce1-t4', title: 'Cambridge FCE 1 · Test 4', reading: [], listening: [] }

];

/* =====================================================================
   MOTORE — non serve modificarlo
   ===================================================================== */
const MAX_PLAYS = 2;            // ascolti consentiti prima della correzione
const SAVE_KEY = 'b2first_v1';
const L = 'ABCDEFGH';

const SEC_LABEL = { reading: 'Reading & Use of English', listening: 'Listening' };
const PART_TYPE = {
  reading: { 1: 'mccloze', 2: 'opencloze', 3: 'wordform', 4: 'transform', 5: 'mclong', 6: 'gapped', 7: 'matching' },
  listening: { 1: 'mcaudio', 2: 'notes', 3: 'speakers', 4: 'mclong' }
};
const PART_INFO = {
  reading: { 1: 'Multiple-choice cloze', 2: 'Open cloze', 3: 'Word formation', 4: 'Key word transformation', 5: 'Multiple choice', 6: 'Gapped text', 7: 'Multiple matching' },
  listening: { 1: 'Short extracts', 2: 'Sentence completion', 3: 'Multiple matching', 4: 'Multiple choice' }
};
const RUBRICS = {
  reading: {
    1: { en: 'For questions 1–8, read the text below and decide which answer (A, B, C or D) best fits each gap.', it: 'Conta la parola che va con quelle intorno: collocazioni, preposizioni, phrasal verbs.' },
    2: { en: 'For questions 9–16, read the text below and think of the word which best fits each gap. Use only one word in each gap.', it: 'Manca quasi sempre una parola grammaticale: preposizione, ausiliare, pronome, connettivo.' },
    3: { en: 'For questions 17–24, read the text below. Use the word given in capitals to form a word that fits in the gap.', it: 'Chiediti prima che parte del discorso serve (nome, aggettivo, avverbio) e se ci vuole un prefisso negativo o il plurale.' },
    4: { en: 'For questions 25–30, complete the second sentence so that it has a similar meaning to the first sentence, using the word given. Do not change the word given. You must use between two and five words, including the word given.', it: 'La parola chiave non si cambia. Da due a cinque parole in tutto, contratte contano come due.' },
    5: { en: 'You are going to read an extract. For questions 31–36, choose the answer (A, B, C or D) which you think fits best according to the text.', it: 'Le domande seguono l\'ordine del testo; attenzione alle opzioni che usano le stesse parole del testo ma dicono altro.' },
    6: { en: 'You are going to read an article. Six sentences have been removed. Choose from the sentences A–G the one which fits each gap. There is one extra sentence which you do not need to use.', it: 'Guarda pronomi, riferimenti e connettivi prima e dopo il buco.' },
    7: { en: 'You are going to read an article. For questions 43–52, choose from the sections (A–E). The sections may be chosen more than once.', it: 'Leggi prima le domande, poi cerca nel testo le parafrasi: raramente trovi le stesse parole.' }
  },
  listening: {
    1: { en: 'You will hear people talking in eight different situations. For questions 1–8, choose the best answer (A, B or C).', it: 'Leggi la domanda prima di ascoltare: spesso si sentono tutte e tre le opzioni.' },
    2: { en: 'For questions 9–18, complete the sentences with a word or short phrase.', it: 'Scrivi le parole che senti, senza riformularle. Attenzione all\'ortografia.' },
    3: { en: 'You will hear five short extracts. For questions 19–23, choose from the list (A–H) what each speaker says. Use the letters only once. There are three extra letters which you do not need to use.', it: 'Ogni lettera si usa una sola volta: prima di ascoltare leggi bene tutte le otto opzioni.' },
    4: { en: 'You will hear an interview. For questions 24–30, choose the best answer (A, B or C).', it: 'Le domande seguono l\'ordine dell\'intervista.' }
  }
};

/* ---------- salvataggio ---------- */
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
function storeBest(key, score, total) {
  try {
    const s = loadSave();
    if (!s[key] || score > s[key].score) s[key] = { score, total };
    localStorage.setItem(SAVE_KEY, JSON.stringify(s));
  } catch (e) {}
}

/* ---------- utilità ---------- */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function norm(s) {
  return String(s).toLowerCase().replace(/[’‘`]/g, "'")
    .replace(/\bcan't\b/g, 'cannot').replace(/\bwon't\b/g, 'will not').replace(/n't\b/g, ' not')
    .replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will').replace(/'m\b/g, ' am').replace(/'d\b/g, ' would')
    .replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function paras(text, gapFn) {
  return String(text || '').trim().split(/\n\s*\n/).map(p => {
    let h = esc(p).replace(/\n/g, '<br>');
    if (gapFn) h = h.replace(/\[(\d+)\]/g, (m, n) => gapFn(+n));
    return '<p>' + h + '</p>';
  }).join('');
}
function titleBox(p, inner) { return `<div class="textbox">${p.title ? `<h3>${esc(p.title)}</h3>` : ''}${inner}</div>`; }

/* ---------- audio ---------- */
let plays = {}, checked = false, player = new Audio(), audioReg = {};
function stopAudio() { try { player.pause(); } catch (e) {} }
function audioHTML(id, src) {
  if (!src) return '<div class="plays">🎧 Audio non ancora inserito</div>';
  audioReg[id] = src;
  plays[id] = plays[id] || 0;
  return `<div class="audiobox"><button class="btn btn-green" id="ab-${id}" onclick="playAudio('${id}')">▶ Ascolta</button>
    <span class="plays" id="pl-${id}">Ascolti: ${plays[id]}/${MAX_PLAYS}</span></div>`;
}
function refreshAudio(id) {
  const b = document.getElementById('ab-' + id), p = document.getElementById('pl-' + id);
  if (p) p.textContent = checked ? 'Ascolto libero' : `Ascolti: ${plays[id]}/${MAX_PLAYS}`;
  if (b) b.disabled = !checked && plays[id] >= MAX_PLAYS;
}
function playAudio(id) {
  const src = audioReg[id]; if (!src) return;
  if (!checked && plays[id] >= MAX_PLAYS) return;
  stopAudio();
  if (!checked) plays[id]++;
  refreshAudio(id);
  player.src = src; player.play().catch(() => alert('File audio non trovato: ' + src));
}

/* ---------- navigazione ---------- */
const app = document.getElementById('app');
function hasContent(t) { return (t.reading && t.reading.length) || (t.listening && t.listening.length); }
function countQ(p) {
  if (p.items) return p.items.length;
  if (p.gaps) return Object.keys(p.gaps).length;
  if (p.answers) return Object.keys(p.answers).length;
  return 0;
}

function showHome() {
  stopAudio(); window.scrollTo(0, 0);
  const save = loadSave();
  let h = `<div class="topbar"><a href="javascript:window.close()" class="btn btn-red">✕ Chiudi questa scheda</a></div>
    <div class="block-title bt-cyan">📚 Scegli il test</div><div class="grid">`;
  TESTS.forEach((t, i) => {
    const on = hasContent(t);
    let done = 0, tot = 0;
    ['reading', 'listening'].forEach(sec => (t[sec] || []).forEach(p => { tot++; if (save[`${t.id}|${sec}|${p.part}`]) done++; }));
    h += `<div class="card c-cyan ${on ? '' : 'off'}" ${on ? `onclick="showTest(${i})"` : ''}>
      <div class="card-name">${esc(t.title)}</div>
      ${on ? `<span class="badge">${done}/${tot} parti svolte</span>` : '<span class="badge">in preparazione</span>'}</div>`;
  });
  app.innerHTML = h + '</div>';
}

function showTest(ti) {
  stopAudio(); window.scrollTo(0, 0);
  const t = TESTS[ti], save = loadSave();
  let h = `<div class="topbar"><button class="btn btn-ghost" onclick="showHome()">← Tutti i test</button></div>
    <h2 class="score" style="margin-bottom:10px">${esc(t.title)}</h2>`;
  if (!hasContent(t)) h += '<div class="empty-note">⏳ Questo test è in preparazione.</div>';
  [['reading', '📖 ' + SEC_LABEL.reading, 'cyan'], ['listening', '🎧 Listening', 'green']].forEach(([sec, lab, col], si) => {
    if (!t[sec] || !t[sec].length) return;
    if (si === 1 && t.reading && t.reading.length) h += '<div class="divider"></div>';
    h += `<div class="block-title bt-${col}">${lab}</div><div class="grid">`;
    t[sec].forEach((p, pi) => {
      const b = save[`${t.id}|${sec}|${p.part}`];
      h += `<div class="card c-${col}" onclick="showPart(${ti},'${sec}',${pi})">
        <div class="card-name">Part ${p.part}</div><div class="card-sub">${PART_INFO[sec][p.part] || ''} · ${countQ(p)} domande</div>
        <span class="badge">${b ? `Migliore: ${b.score}/${b.total}` : 'Da fare'}</span></div>`;
    });
    h += '</div>';
  });
  app.innerHTML = h;
}

/* ---------- elementi di risposta ---------- */
let cur = null, keys = [];
function mcQuestion(n, q, options, answer, extra) {
  keys.push({ n, kind: 'radio', type: 'letter', v: answer, box: true });
  let h = `<div class="q" id="q-${n}">${extra || ''}<div class="q-head"><span class="q-num">${n}</span>${esc(q || '')}</div>`;
  options.forEach((o, i) => {
    h += `<label class="opt"><input type="radio" name="r-${n}" value="${L[i]}"><b>${L[i]}</b><span>${esc(o)}</span></label>`;
  });
  return h + `<div class="fb" id="fb-${n}"></div></div>`;
}
function selectGap(n, letters, answer, labels) {
  keys.push({ n, kind: 'select', type: 'letter', v: answer, label: labels ? labels[letters.indexOf(answer)] : '' });
  let o = '<option value="">—</option>';
  letters.forEach((l, i) => { o += `<option value="${l}">${labels ? l + ' ' + esc(labels[i]) : l}</option>`; });
  return `<span class="gapwrap" id="g-${n}"><span class="gapnum">${n}</span><select id="in-${n}">${o}</select><span class="gapfix" id="fb-${n}"></span></span>`;
}
function textGap(n, answers, after) {
  keys.push({ n, kind: 'text', type: 'text', v: answers || [] });
  return `<span class="gapwrap" id="g-${n}"><span class="gapnum">${n}</span><input class="gap" id="in-${n}" autocomplete="off" spellcheck="false">${after || ''}<span class="gapfix" id="fb-${n}"></span></span>`;
}
function selectQuestion(n, head, letters, answer, extra) {
  keys.push({ n, kind: 'select', type: 'letter', v: answer, box: true });
  let o = '<option value="">—</option>'; letters.forEach(l => o += `<option value="${l}">${l}</option>`);
  return `<div class="q" id="q-${n}">${extra || ''}<div class="q-head"><span class="q-num">${n}</span>${esc(head)}
    <span class="gapwrap" id="g-${n}"><select id="in-${n}">${o}</select></span></div><div class="fb" id="fb-${n}"></div></div>`;
}

/* ---------- rendering delle parti ---------- */
function renderPart(sec, p) {
  const type = PART_TYPE[sec][p.part];
  let h = '';
  if (sec === 'listening' && (p.intro || p.audio !== undefined) && type !== 'mcaudio')
    h += `<div class="q-context" style="font-size:1rem">${esc(p.intro || '')}</div>${audioHTML('main', p.audio)}`;

  if (type === 'mccloze') {
    h += titleBox(p, paras(p.text, n => { const g = p.gaps[n]; return g ? selectGap(n, g.options.map((_, i) => L[i]), g.answer, g.options) : '[' + n + ']'; }));
  } else if (type === 'opencloze') {
    h += titleBox(p, paras(p.text, n => textGap(n, p.answers[n])));
  } else if (type === 'wordform') {
    h += titleBox(p, paras(p.text, n => textGap(n, p.answers[n], p.stems && p.stems[n] ? `<span class="stem">(${esc(p.stems[n])})</span>` : '')));
  } else if (type === 'transform') {
    p.items.forEach(it => {
      keys.push({ n: it.n, kind: 'text', type: 'text', v: it.answers || [], box: true });
      h += `<div class="q" id="q-${it.n}"><div class="q-head"><span class="q-num">${it.n}</span></div>
        <div class="tf-first">${esc(it.first)}</div><div class="tf-key">${esc(it.key)}</div>
        <div class="tf-line">${esc(it.before || '')} <span class="gapwrap" id="g-${it.n}"><input class="gap" id="in-${it.n}" autocomplete="off" spellcheck="false"></span> ${esc(it.after || '')}</div>
        <div class="fb" id="fb-${it.n}"></div></div>`;
    });
  } else if (type === 'mclong') {
    if (p.text) h += titleBox(p, paras(p.text));
    p.items.forEach(it => { h += mcQuestion(it.n, it.q, it.options, it.answer); });
  } else if (type === 'gapped') {
    const letters = p.options.map(o => o.letter);
    h += `<div class="optlist">${p.options.map(o => `<div><b>${o.letter}</b> ${esc(o.text)}</div>`).join('')}</div>`;
    h += titleBox(p, paras(p.text, n => selectGap(n, letters, p.answers[n])));
  } else if (type === 'matching') {
    const letters = p.sections.map(s => s.letter);
    h += `<div class="textbox">${p.title ? `<h3>${esc(p.title)}</h3>` : ''}${p.sections.map(s =>
      `<div class="mtext"><b>${s.letter}</b><strong>${esc(s.title || '')}</strong>${paras(s.text)}</div>`).join('')}</div>`;
    h += '<div class="q-context" style="font-size:1rem">Which section…</div>';
    p.items.forEach(it => { h += selectQuestion(it.n, it.q, letters, it.answer); });
  } else if (type === 'mcaudio') {
    p.items.forEach(it => {
      const extra = (it.context ? `<div class="q-context">${esc(it.context)}</div>` : '') + audioHTML('a' + it.n, it.audio);
      h += mcQuestion(it.n, it.q, it.options, it.answer, extra);
    });
  } else if (type === 'notes') {
    h += titleBox(p, paras(p.notes, n => textGap(n, p.answers[n])));
  } else if (type === 'speakers') {
    const letters = p.options.map(o => o.letter);
    h += `<div class="optlist">${p.options.map(o => `<div><b>${o.letter}</b> ${esc(o.text)}</div>`).join('')}</div>`;
    p.items.forEach(it => { h += selectQuestion(it.n, it.label, letters, it.answer); });
  }
  return h;
}

function showPart(ti, sec, pi) {
  stopAudio(); window.scrollTo(0, 0);
  checked = false; plays = {}; audioReg = {}; keys = [];
  const t = TESTS[ti], p = t[sec][pi];
  cur = { ti, sec, pi, t, p };
  const r = RUBRICS[sec][p.part] || { en: '', it: '' };
  let h = `<div class="sec-${sec}"><div class="topbar"><button class="btn btn-ghost" onclick="showTest(${ti})">← ${esc(t.title)}</button></div>
    <div class="block-title bt-${sec === 'reading' ? 'cyan' : 'green'}">${SEC_LABEL[sec]} · Part ${p.part}</div>
    <div class="rubric"><div class="en">${esc(p.rubric || r.en)}</div><div class="it">💡 ${esc(r.it)}</div></div>`;
  h += renderPart(sec, p);
  h += `<div class="resultbar"><button class="btn btn-red" id="checkBtn" onclick="checkPart()">✔ Correggi</button>
    <span class="score" id="scoreOut"></span>
    <button class="btn btn-ghost" id="retryBtn" style="display:none" onclick="showPart(${ti},'${sec}',${pi})">↻ Riprova</button></div></div>`;
  app.innerHTML = h;
}

/* ---------- correzione ---------- */
function checkPart() {
  let score = 0;
  keys.forEach(k => {
    let given = '';
    if (k.kind === 'radio') { const r = document.querySelector(`input[name="r-${k.n}"]:checked`); given = r ? r.value : ''; }
    else given = document.getElementById('in-' + k.n).value;
    const ok = k.type === 'text' ? norm(given) !== '' && k.v.some(a => norm(a) === norm(given)) : given === k.v;
    if (ok) score++;
    const gw = document.getElementById('g-' + k.n), qb = document.getElementById('q-' + k.n);
    if (gw) gw.classList.add(ok ? 'ok' : 'ko');
    if (qb) qb.classList.add(ok ? 'ok' : 'ko');
    const fb = document.getElementById('fb-' + k.n);
    if (fb) {
      const sol = k.type === 'text' ? (k.v[0] || '?') : k.v + (k.label ? ' (' + k.label + ')' : '');
      if (k.box) fb.textContent = ok ? '✓ Corretto' : '✗ Risposta corretta: ' + sol;
      else fb.textContent = ok ? '✓' : '→ ' + sol;
      fb.style.color = ok ? '#00a83a' : '#e00000';
    }
  });
  document.querySelectorAll('#app input, #app select').forEach(el => el.disabled = true);
  checked = true;
  Object.keys(audioReg).forEach(refreshAudio);
  const tot = keys.length;
  document.getElementById('scoreOut').textContent = `${score}/${tot}`;
  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('retryBtn').style.display = 'inline-block';
  storeBest(`${cur.t.id}|${cur.sec}|${cur.p.part}`, score, tot);
}

/* apertura diretta di un test: b2-first.html?test=fce1-t1 */
(function () {
  const id = new URLSearchParams(location.search).get('test');
  const i = TESTS.findIndex(t => t.id === id);
  if (i >= 0) showTest(i); else showHome();
})();
