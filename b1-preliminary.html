<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B1 Preliminary</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; font-family: 'Nunito', sans-serif; color: #eee; }

  .hero { background: #FF0000; padding: 40px 40px 32px; display: flex; align-items: center; gap: 26px; }
  .hero-letter { font-family: 'Bebas Neue', sans-serif; font-size: 7rem; color: #000; line-height: 1; flex-shrink: 0; }
  .hero-text h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 3px; color: #000; }
  .hero-text p { font-size: 1rem; color: #111; margin-top: 4px; font-weight: 700; }

  .main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 60px; }
  #app { font-size: 1.08rem; }
  .btn { display: inline-block; border: none; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 900; border-radius: 20px; padding: 8px 20px; font-size: 0.95rem; text-decoration: none; transition: all 0.2s; }
  .btn-red { background: #FF0000; color: #000; }
  .btn-cyan { background: #00CFCF; color: #000; }
  .btn-green { background: #00CC44; color: #000; }
  .btn-ghost { background: #222; color: #eee; }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .topbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }

  .block-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 4px; padding: 10px 22px; border-radius: 8px; margin: 10px 0 16px; display: inline-block; color: #000; }
  .bt-red { background: #FF0000; } .bt-cyan { background: #00CFCF; } .bt-green { background: #00CC44; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-bottom: 30px; }
  .card { border-radius: 14px; padding: 18px 20px; color: #000; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.5); transition: transform 0.2s; display: flex; flex-direction: column; gap: 8px; }
  .card:hover { transform: translateY(-4px); }
  .card.off { opacity: 0.45; cursor: not-allowed; }
  .card.off:hover { transform: none; }
  .c-red { background: #FF0000; } .c-cyan { background: #00CFCF; } .c-green { background: #00CC44; }
  .card-name { font-weight: 900; font-size: 1.1rem; }
  .card-sub { font-size: 0.85rem; font-weight: 700; }
  .badge { align-self: flex-start; background: rgba(0,0,0,0.25); border-radius: 10px; padding: 3px 10px; font-size: 0.78rem; font-weight: 900; }

  .divider { height: 4px; border-radius: 4px; margin: 8px 0 30px; background: linear-gradient(90deg, #00CFCF, #FF0000, #00CC44); }

  .rubric { background: #1a1a1a; border-left: 6px solid #FF0000; border-radius: 8px; padding: 14px 18px; margin-bottom: 22px; }
  .rubric .en { font-weight: 700; font-size: 1.02rem; }
  .rubric .it { font-size: 0.9rem; color: #bbb; margin-top: 6px; }
  .sec-reading .rubric { border-left-color: #00CFCF; }
  .sec-listening .rubric { border-left-color: #00CC44; }

  .textbox { background: #f4f1e8; color: #111; border-radius: 10px; padding: 18px 22px; margin-bottom: 18px; line-height: 1.65; font-size: 1.02rem; }
  .textbox h3 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; font-size: 1.5rem; margin-bottom: 8px; }
  .textbox p { margin-bottom: 10px; }
  .notice { background: #fffbe0; color: #111; border: 2px solid #333; border-radius: 8px; padding: 12px 16px; margin: 8px 0 12px; line-height: 1.5; white-space: pre-line; }

  .q { background: #181818; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; border: 2px solid transparent; }
  .q.ok { border-color: #00CC44; } .q.ko { border-color: #FF0000; }
  .q-head { font-weight: 900; margin-bottom: 8px; }
  .q-num { display: inline-block; background: #FF0000; color: #000; border-radius: 6px; padding: 0 8px; margin-right: 8px; }
  .sec-reading .q-num { background: #00CFCF; } .sec-listening .q-num { background: #00CC44; }
  .q-context { font-size: 0.9rem; color: #aaa; margin-bottom: 6px; font-style: italic; }
  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .opt:hover { background: #242424; }
  .opt input { margin-top: 4px; accent-color: #FF0000; }
  .opt b { min-width: 18px; }
  .opt img { max-width: 260px; border-radius: 6px; background: #fff; }
  .qimg { display: block; max-width: 100%; width: 720px; background: #fff; border-radius: 8px; margin: 6px 0 10px; }
  .notice img { width: 520px; max-width: 100%; }
  .fb { margin-top: 6px; font-weight: 900; font-size: 0.92rem; }
  .fb.ok { color: #00CC44; } .fb.ko { color: #ff5555; }

  select, input.gap { font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 700; border: 2px solid #333; border-radius: 6px; padding: 2px 6px; background: #fff; color: #000; }
  input.gap { width: 140px; }
  .gapwrap { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .gapnum { font-weight: 900; font-size: 0.8rem; background: #111; color: #fff; border-radius: 4px; padding: 0 5px; }
  .gapwrap.ok select, .gapwrap.ok input { border-color: #00CC44; background: #e6ffed; }
  .gapwrap.ko select, .gapwrap.ko input { border-color: #FF0000; background: #ffe6e6; }
  .gapfix { font-weight: 900; color: #c00; font-size: 0.85rem; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } .hero { padding: 28px 16px; } .hero-letter { font-size: 4.5rem; } .hero-text h1 { font-size: 2.2rem; } }
  .mtext { background: #f4f1e8; color: #111; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; line-height: 1.5; font-size: 0.95rem; }
  .mtext b { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 1px; margin-right: 6px; }
  .optlist { background: #1c1c1c; border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; line-height: 1.6; }
  .optlist div { margin-bottom: 4px; }

  .audiobox { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 10px; }
  .plays { font-size: 0.85rem; font-weight: 700; color: #aaa; }
  .transcript { display: none; background: #222; border-radius: 8px; padding: 10px 14px; margin-top: 8px; white-space: pre-line; font-size: 0.9rem; line-height: 1.5; color: #ddd; }
  .transcript.show { display: block; }
  .tbtn { background: none; border: 1px solid #555; color: #ccc; border-radius: 14px; padding: 3px 12px; font-size: 0.8rem; cursor: pointer; margin-top: 6px; }

  .resultbar { position: sticky; bottom: 0; background: #0d0d0d; padding: 14px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-top: 2px solid #222; margin-top: 10px; }
  .score { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 2px; }
  .empty-note { background: #1a1a1a; border-radius: 10px; padding: 18px; color: #bbb; }
  .tf-line { line-height: 2; }
  .tf-line input.gap { width: 220px; max-width: 100%; }
  .notice img { display: block; }
  .longwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .textcol { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow-y: auto; border-radius: 10px; }
  .textcol .textbox { margin-bottom: 0; }
  .two-col > div:last-child { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow-y: auto; }
  @media (max-width: 860px) {
    .longwrap { grid-template-columns: 1fr; }
    .textcol, .two-col > div:last-child { position: static; max-height: none; }
  }
  .pill input { display: none; }
  .pill span { display: inline-block; padding: 6px 14px; border-radius: 16px; background: #2a2a2a; color: #eee; font-weight: 900; cursor: pointer; }
  .pill input:checked + span { background: #FF0000; color: #000; }
  .wt-ver { color: #555; font-size: 0.75rem; margin: -6px 0 10px; }
  .wt-choice { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .wt-area { width: 100%; min-height: 220px; background: #000; color: #fff; border: 1px solid #333; border-radius: 10px; padding: 14px; font-family: 'Nunito', sans-serif; font-size: 1rem; line-height: 1.5; resize: vertical; }
  .wt-area:focus { outline: none; border-color: #FF0000; }
  .wt-meta { display: flex; justify-content: space-between; color: #888; font-size: 0.85rem; font-weight: 800; margin: 6px 0 12px; }
  .wt-err { display: none; margin-top: 14px; padding: 12px; background: rgba(255,0,0,0.15); border: 1px solid #ff4444; border-radius: 8px; color: #ff6666; font-weight: 700; }
  .wt-res { display: none; margin-top: 18px; padding: 20px; background: #000; border-left: 4px solid #FF0000; border-radius: 8px; line-height: 1.7; }
  .wt-res h3 { margin: 10px 0 6px; color: #FF0000; }
  .wt-res ul { margin-left: 20px; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-letter">B1</div>
  <div class="hero-text">
    <h1>B1 Preliminary</h1>
    <p>Reading · Writing · Listening — Certificazioni</p>
  </div>
</div>

<div class="main" id="app"></div>

<script>
/* =====================================================================
   ELENCO DEI TEST
   ---------------------------------------------------------------------
   Ogni test ha il suo file nella cartella tests/ del repo (es. tests/pet1-t1.js),
   creato con editor.html: non serve modificare questo file.
   Per aggiungere un libro nuovo basta aggiungere qui 4 righe come queste.
   ===================================================================== */
window.TESTDATA = window.TESTDATA || {};

const TESTS = [

/* ---- Cambridge PET 1 (i contenuti si creano con editor.html e si caricano nella cartella tests/) ---- */
{ id:'pet1-t1', title:'Cambridge PET 1 · Test 1', src:'tests/pet1-t1.js' },
{ id:'pet1-t2', title:'Cambridge PET 1 · Test 2', src:'tests/pet1-t2.js' },
{ id:'pet1-t3', title:'Cambridge PET 1 · Test 3', src:'tests/pet1-t3.js' },
{ id:'pet1-t4', title:'Cambridge PET 1 · Test 4', src:'tests/pet1-t4.js' }

];

/* =====================================================================
   MOTORE — non serve modificarlo
   ===================================================================== */
const MAX_PLAYS = 2;            // ascolti consentiti prima della correzione
const SAVE_KEY = 'b1prelim_v2';
const L = 'ABCDEFGH';
const SECTIONS = [['reading', '📖 Reading', 'cyan'], ['writing', '✍️ Writing', 'red'], ['listening', '🎧 Listening', 'green']];
const SEC_NAME = { reading: 'Reading', writing: 'Writing', listening: 'Listening' };

const FORMATS = {
  '2010': {
    reading: {
      1: { opts: 3, type: 'notices', info: 'Short texts', en: 'Look at the text in each question. What does it say? Choose the correct letter A, B or C.', it: 'Leggi l\'avviso e scegli la frase che ne riporta il significato.' },
      2: { opts: 8, type: 'match', info: 'Matching', en: 'The people below all want to find something. Read the eight texts and decide which one would be the most suitable for each person.', it: 'Ogni persona ha più richieste: il testo giusto le soddisfa tutte.' },
      3: { type: 'truefalse', info: 'True / False', labels: ['Correct', 'Incorrect'], en: 'Look at the sentences below. Read the text to decide if each sentence is correct or incorrect.', it: 'Cerca nel testo il punto preciso: le frasi seguono l\'ordine del testo.' },
      4: { opts: 4, type: 'mclong', info: 'Multiple choice', en: 'Read the text and questions below. For each question, choose the correct letter A, B, C or D.', it: 'Alcune domande riguardano l\'opinione o lo scopo di chi scrive, non solo i fatti.' },
      5: { opts: 4, type: 'mccloze', info: 'Multiple-choice cloze', en: 'Read the text below and choose the correct word for each space.', it: 'Una sola parola va bene con quelle intorno: guarda preposizioni e collocazioni.' }
    },
    writing: {
      1: { type: 'transform', info: 'Sentence transformation', en: 'For each question, complete the second sentence so that it means the same as the first. Use no more than three words.', it: 'Al massimo tre parole. Le contrazioni contano come due parole; l\'ortografia deve essere esatta.' },
      2: { type: 'writetask', info: 'Short message', en: 'Write a short message. Write 35–45 words.', it: 'Devi trattare tutti e tre i punti della consegna: ognuno vale per il punteggio.' },
      3: { type: 'writetask', info: 'Letter or story', choice: true, en: 'Choose ONE question. Write about 100 words.', it: 'Scegli la lettera o la storia. Usa connettivi (and, but, because, so, then…) e varia i tempi verbali.' }
    },
    listening: {
      1: { opts: 3, type: 'mcaudio', info: 'Short recordings', en: 'There are seven questions in this part. For each question, choose the correct answer.', it: 'Leggi la domanda prima di ascoltare: spesso si sentono tutte e tre le opzioni.' },
      2: { opts: 3, type: 'mclong', info: 'Interview', en: 'For each question, choose the correct answer A, B or C.', it: 'Le domande seguono l\'ordine della registrazione.' },
      3: { type: 'notes', info: 'Gap fill', en: 'For each question, fill in the missing information in the numbered space.', it: 'Prima di ascoltare, prova a indovinare che tipo di informazione manca (numero, orario, nome…).' },
      4: { type: 'truefalse', info: 'True / False', labels: ['Yes', 'No'], en: 'Look at the six sentences for this part. Decide if each sentence is correct or incorrect. If it is correct, choose A for YES. If it is not correct, choose B for NO.', it: 'Attenzione a chi dice cosa: spesso le frasi riguardano l\'opinione di uno solo dei due.' }
    }
  },
  '2020': {
    reading: {
      1: { opts: 3, type: 'notices', info: 'Short texts', en: 'For each question, choose the correct answer.', it: 'Leggi il breve testo e scegli la frase che ne riporta il significato.' },
      2: { opts: 8, type: 'match', info: 'Matching', en: 'For each question, choose the correct answer. The people below all want to find something. Read the eight texts and decide which one would be the most suitable for each person.', it: 'Ogni persona ha più richieste: il testo giusto le soddisfa tutte.' },
      3: { opts: 4, type: 'mclong', info: 'Long text', en: 'For each question, choose the correct answer.', it: 'Leggi tutto il testo una volta, poi rispondi: le domande seguono l\'ordine del testo.' },
      4: { type: 'gapped', info: 'Gapped text', en: 'Five sentences have been removed from the text below. For each question, choose the correct answer. There are three extra sentences which you do not need to use.', it: 'Guarda cosa c\'è prima e dopo il buco: pronomi e collegamenti ti dicono quale frase va lì.' },
      5: { opts: 4, type: 'mccloze', info: 'Multiple-choice cloze', en: 'For each question, choose the correct answer.', it: 'Una sola parola funziona con le parole intorno (preposizioni, collocazioni).' },
      6: { type: 'opencloze', info: 'Open cloze', en: 'For each question, write the correct answer. Write ONE word for each gap.', it: 'Di solito manca una parola grammaticale: preposizione, articolo, congiunzione, ausiliare.' }
    },
    listening: {
      1: { opts: 3, type: 'mcaudio', info: 'Short recordings', en: 'For each question, choose the correct answer.', it: 'Leggi la domanda prima di ascoltare: spesso sentirai nominare tutte e tre le opzioni.' },
      2: { opts: 3, type: 'mcaudio', info: 'Short conversations', en: 'For each question, choose the correct answer.', it: 'Ascolta come si sentono o cosa pensano i parlanti, non solo i fatti.' },
      3: { type: 'notes', info: 'Gap fill', en: 'For each question, write the correct answer in the gap. Write one or two words or a number or a date or a time.', it: 'Prima di ascoltare, prova a indovinare che tipo di informazione manca.' },
      4: { opts: 3, type: 'mclong', info: 'Interview', en: 'For each question, choose the correct answer.', it: 'Le domande seguono l\'ordine dell\'intervista.' }
    }
  }
};
function spec(t, sec, p) { const f = FORMATS[t.format || '2020'] || FORMATS['2020']; return (f[sec] && f[sec][p.part]) || { type: '', info: '', en: '', it: '' }; }

/* ---------- salvataggio ---------- */
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
function storeBest(key, score, total) {
  try {
    const s = loadSave();
    if (!s[key] || score > s[key].score) s[key] = { score, total };
    localStorage.setItem(SAVE_KEY, JSON.stringify(s));
  } catch (e) {}
}

/* ---------- utilità ---------- */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function norm(s) {
  return String(s).toLowerCase().replace(/[’‘`]/g, "'")
    .replace(/\bcan't\b/g, 'cannot').replace(/\bwon't\b/g, 'will not').replace(/n't\b/g, ' not')
    .replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will').replace(/'m\b/g, ' am').replace(/'d\b/g, ' would')
    .replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function paras(text, gapFn) {
  return String(text || '').trim().split(/\n\s*\n/).map(p => {
    let h = esc(p).replace(/\n/g, '<br>');
    if (gapFn) h = h.replace(/\[(\d+)\]/g, (m, n) => gapFn(+n));
    return '<p>' + h + '</p>';
  }).join('');
}
function titleBox(p, inner) { return `<div class="textbox">${p.title ? `<h3>${esc(p.title)}</h3>` : ''}${inner}</div>`; }
function optLabel(o) { return (o && typeof o === 'object' && o.img) ? `<img src="${esc(o.img)}" alt="">` : esc(o); }
/* una parte è "pronta" quando contiene almeno un testo */
function filled(p) {
  let found = false;
  (function walk(o) {
    if (found || !o || typeof o !== 'object') return;
    for (const k in o) {
      const v = o[k];
      if (['text', 'q', 'name', 'first', 'notes', 'img', 'task'].includes(k) && typeof v === 'string' && v.trim()) { found = true; return; }
      if (typeof v === 'object') walk(v);
    }
  })(p);
  return found;
}
function readyParts(t, sec) { return (t[sec] || []).filter(filled); }

/* ---------- audio ---------- */
let plays = {}, checked = false, player = new Audio(), audioReg = {};
function stopAudio() { try { player.pause(); } catch (e) {} }
function audioHTML(id, src) {
  if (!src) return '';
  audioReg[id] = src;
  plays[id] = plays[id] || 0;
  return `<div class="audiobox"><button class="btn btn-green" id="ab-${id}" onclick="playAudio('${id}')">▶ Ascolta</button>
    <span class="plays" id="pl-${id}">Ascolti: ${plays[id]}/${MAX_PLAYS}</span></div>`;
}
function refreshAudio(id) {
  const b = document.getElementById('ab-' + id), p = document.getElementById('pl-' + id);
  if (p) p.textContent = checked ? 'Ascolto libero' : `Ascolti: ${plays[id]}/${MAX_PLAYS}`;
  if (b) b.disabled = !checked && plays[id] >= MAX_PLAYS;
}
function playAudio(id) {
  const src = audioReg[id]; if (!src) return;
  if (!checked && plays[id] >= MAX_PLAYS) return;
  stopAudio();
  if (!checked) plays[id]++;
  refreshAudio(id);
  player.src = src; player.play().catch(() => alert('File audio non trovato: ' + src));
}

/* ---------- navigazione ---------- */
const app = document.getElementById('app');
function hasContent(t) { return SECTIONS.some(([sec]) => readyParts(t, sec).length); }
function countQ(p) {
  if (p.key) return Object.keys(p.key).length;
  if (p.items) return p.items.length;
  if (p.people) return p.people.length;
  if (p.gaps) return Object.keys(p.gaps).length;
  if (p.answers) return Object.keys(p.answers).length;
  return 0;
}

function showHome() {
  stopAudio(); window.scrollTo(0, 0);
  const save = loadSave();
  let h = `<div class="topbar"><a href="javascript:window.close()" class="btn btn-red">✕ Chiudi questa scheda</a></div>
    <div class="block-title bt-red">📚 Scegli il test</div><div class="grid">`;
  TESTS.forEach((t, i) => {
    const on = hasContent(t) || (t.src && !t.loaded);
    let done = 0, tot = 0;
    SECTIONS.forEach(([sec]) => readyParts(t, sec).forEach(p => { tot++; if (save[`${t.id}|${sec}|${p.part}`]) done++; }));
    h += `<div class="card c-red ${on ? '' : 'off'}" ${on ? `onclick="go('${t.id}')"` : ''}>
      <div class="card-name">${esc(t.title)}</div>
      ${on ? (tot ? `<span class="badge">${done}/${tot} parti svolte</span>` : '<span class="badge">Apri</span>') : '<span class="badge">in preparazione</span>'}</div>`;
  });
  app.innerHTML = h + '</div>';
}

function loadTest(t, done) {
  if (!t.src || t.loaded) return done();
  const s = document.createElement('script');
  s.src = t.src + '?v=' + Date.now();
  s.onload = () => { Object.assign(t, window.TESTDATA[t.id] || {}); t.loaded = true; done(); };
  s.onerror = () => { t.loaded = true; done(); };
  document.head.appendChild(s);
}
function showTest(ti) {
  const t0 = TESTS[ti];
  if (t0.src && !t0.loaded) { app.innerHTML = '<div class="empty-note">Caricamento…</div>'; return loadTest(t0, () => showTest(ti)); }
  stopAudio(); window.scrollTo(0, 0);
  const t = TESTS[ti], save = loadSave();
  let h = `<div class="topbar"><button class="btn btn-ghost" onclick="go('')">← Tutti i test</button></div>
    <h2 class="score" style="margin-bottom:10px">${esc(t.title)}</h2>`;
  if (!hasContent(t)) h += '<div class="empty-note">⏳ Questo test è in preparazione.</div>';
  let first = true;
  SECTIONS.forEach(([sec, lab, col]) => {
    const parts = readyParts(t, sec);
    if (!parts.length) return;
    if (!first) h += '<div class="divider"></div>';
    first = false;
    h += `<div class="block-title bt-${col}">${lab}</div><div class="grid">`;
    parts.forEach(p => {
      const pi = t[sec].indexOf(p), b = save[`${t.id}|${sec}|${p.part}`];
      h += `<div class="card c-${col}" onclick="go('${t.id}/${sec}/${p.part}')">
        <div class="card-name">Part ${p.part}</div><div class="card-sub">${spec(t, sec, p).info}${spec(t, sec, p).type === 'writetask' ? ' · valutazione IA' : ' · ' + countQ(p) + ' domande'}</div>
        <span class="badge">${b ? `Migliore: ${b.score}/${b.total}` : 'Da fare'}</span></div>`;
    });
    h += '</div>';
  });
  app.innerHTML = h;
}

/* ---------- elementi di risposta ---------- */
let cur = null, keys = [];
function mcQuestion(n, q, options, answer, extra, afterHead) {
  keys.push({ n, kind: 'radio', type: 'letter', v: answer, box: true });
  let h = `<div class="q" id="q-${n}">${extra || ''}<div class="q-head"><span class="q-num">${n}</span>${esc(q || '')}</div>${afterHead || ''}`;
  options.forEach((o, i) => {
    h += `<label class="opt"><input type="radio" name="r-${n}" value="${L[i]}"><b>${L[i]}</b><span>${optLabel(o)}</span></label>`;
  });
  return h + `<div class="fb" id="fb-${n}"></div></div>`;
}
function selectGap(n, letters, answer, labels) {
  keys.push({ n, kind: 'select', type: 'letter', v: answer, label: labels ? labels[letters.indexOf(answer)] : '' });
  let o = '<option value="">—</option>';
  letters.forEach((l, i) => { o += `<option value="${l}">${labels ? l + ' ' + esc(labels[i]) : l}</option>`; });
  return `<span class="gapwrap" id="g-${n}"><span class="gapnum">${n}</span><select id="in-${n}">${o}</select><span class="gapfix" id="fb-${n}"></span></span>`;
}
function textGap(n, answers) {
  keys.push({ n, kind: 'text', type: 'text', v: answers || [] });
  return `<span class="gapwrap" id="g-${n}"><span class="gapnum">${n}</span><input class="gap" id="in-${n}" autocomplete="off" spellcheck="false"><span class="gapfix" id="fb-${n}"></span></span>`;
}



/* ---------- writing Part 2 e 3: consegna + testo + tutor IA (stesso Worker del B2) ---------- */
const WT_URL = 'https://writingtutor-b1.cristinavallini64.workers.dev/';
const WT_INFO = {
  message: { name: 'short message (PET for Schools, Writing Part 2)', min: 35, max: 45, target: '35 - 45 parole', scale: 'p2' },
  letter: { name: 'informal letter (PET for Schools, Writing Part 3)', min: 80, max: 130, target: 'circa 100 parole', scale: 'p3' },
  story: { name: 'story (PET for Schools, Writing Part 3)', min: 80, max: 130, target: 'circa 100 parole', scale: 'p3' }
};
const WT_SCALES = {
  p2: `Scala Cambridge per il messaggio breve (punteggio da 0 a 5):
5 = tutti e tre i punti richiesti sono trattati in modo appropriato; il messaggio è chiaro per il lettore.
4 = tutti e tre i punti sono trattati in modo adeguato; nel complesso il messaggio arriva.
3 = tutti i punti sono tentati ma il lettore deve fare qualche sforzo, OPPURE manca un punto ma gli altri sono chiari.
2 = due punti mancano o non sono riusciti; il messaggio arriva solo in parte; OPPURE testo un po' corto (20–25 parole).
1 = poco contenuto pertinente, il lettore fa molta fatica, OPPURE testo molto corto (10–19 parole).
0 = contenuto del tutto non pertinente o incomprensibile, oppure meno di 10 parole.
Gli errori piccoli non tolgono punti se il messaggio è chiaro.
Sii rigoroso come un vero esaminatore Cambridge: per ogni punto richiesto controlla che risponda ESATTAMENTE alla consegna (informazione precisa, tempo verbale e funzione richiesti, per esempio un'intenzione futura se la consegna chiede cosa farà). Se un punto è vago, impreciso o risponde a una domanda diversa, è trattato solo in parte. Il 5 si dà solo se tutti i punti sono pienamente appropriati e il messaggio è chiarissimo; con un punto trattato solo in parte il massimo è 4. Un punto conta come presente SOLO se lo studente fa esplicitamente quello che la consegna chiede (es. "proporre un altro giorno" = deve proporre di vedersi e indicare quando). Non "salvare" un punto interpretando una frase che non lo esprime: in quel caso il punto MANCA e il voto massimo è 3. Superare un po' il numero di parole non toglie punti.`,
  p3: `Scala Cambridge per la lettera / storia (banda da 0 a 5):
5 = il testo ottiene pienamente l'effetto voluto sul lettore; lingua sicura e ambiziosa per il livello, ampia varietà di strutture e lessico; collegamenti semplici efficaci e testo ben organizzato; errori solo minori; nessuno sforzo per il lettore.
4 = ottiene l'effetto voluto; lingua abbastanza ambiziosa, una certa varietà; qualche collegamento e una certa organizzazione; errori che non impediscono la comprensione; poco sforzo per il lettore.
3 = a tratti fatica a ottenere l'effetto; lingua poco ambiziosa oppure ambiziosa ma imprecisa; un tentativo di organizzazione ma collegamenti non sempre tenuti; errori per lo più non gravi; un certo sforzo per il lettore.
2 = fatica a ottenere l'effetto; lingua semplicistica, limitata o ripetitiva; testo poco coerente; molti errori che a volte impediscono la comprensione.
1 = effetto negativo sul lettore; lingua molto limitata; testo seriamente incoerente.
0 = troppo poco testo da valutare, illeggibile o non pertinente.
Testi sotto le 80 parole ricevono punteggi più bassi.
ATTENZIONE: in questa parte NON si contano i "punti" della consegna e NON si toglie banda perché manca un dettaglio: basta che il testo risponda alla consegna in modo pertinente. Si valutano l'effetto sul lettore, la varietà e l'ambizione di strutture e lessico, l'organizzazione e i connettivi. Gli errori minori, soprattutto se nascono da tentativi ambiziosi, NON abbassano la banda: un testo sicuro, ricco e ben collegato con pochi errori minori è banda 5.
CALIBRAZIONE (esempi reali Cambridge, usali come riferimento):
- BANDA 5: lettera di circa 100 parole, sicura e ambiziosa, con frasi complesse ("I want to tell you that…", "things that you don't want to talk about…"), connettivi semplici ben usati (first of all, because, also, but), solo 2-3 errori minori di ortografia. Banda 5 anche se non risponde a una delle domande dell'amico.
- BANDA 4: storia abbastanza ambiziosa (discorso diretto, frasi come "a pretty girl with big green eyes"), organizzata in ordine cronologico con when/since/until, alcuni errori che non impediscono la comprensione ("I was arriving to my new school").
- BANDA 3: lingua poco ambiziosa ma adeguata, lessico ripetitivo ("I really like eating at home" ripetuto), poca varietà, diversi errori non gravi ("allot", "depending in"); oppure storia semplice con frasi brevi in sequenza e diversi errori ("we start playing whit her").
- BANDA 2: lingua limitata e ripetitiva, frasi brevi non collegate, punteggiatura irregolare, errori numerosi che a volte rendono difficile capire ("tell me how was did you do").
Confronta il testo con questi esempi e scegli la banda più vicina: non essere né più severo né più generoso.
DISTINZIONE TRA 3 E 4: la banda 4 richiede una lingua "abbastanza ambiziosa" (varietà di tempi verbali e strutture, lessico non ripetuto). Se il testo usa quasi solo strutture semplici e ripete le stesse parole o frasi (es. "I really like… I really prefer… I like…"), è banda 3 anche se si capisce bene e contiene un connettivo come "although".
DISTINZIONE TRA 2 E 3: se il testo è fatto soprattutto di frasi brevi e semplici messe una dopo l'altra (soggetto + verbo + complemento, quasi senza subordinate), con pochi connettivi e con errori frequenti di base (articoli mancanti, soggetto mancante, verbo sbagliato) che costringono il lettore a rileggere, è banda 2, anche se la storia ha un senso e un finale. Una trama interessante non alza la banda: conta la lingua.
CONTROLLO FINALE (i valutatori automatici tendono a dare un punto in più): la banda 4 o 5 si dà solo se gli errori sono OCCASIONALI. Se ci sono errori di base in diverse frasi (tempi verbali sbagliati, articoli usati male o mancanti, soggetto mancante, verbi irregolari sbagliati), la banda massima è 3, anche se il testo ha un inizio o qualche frase ambiziosa. Prima di rispondere conta gli errori di base: con 4 o più errori di base la banda non può superare 3.`
};
/* chiamata al Worker con nuovi tentativi automatici se il servizio è sovraccarico */
async function wtCall(prompt, onRetry) {
  for (let i = 0; i < 2; i++) {
    try {
      const r = await fetch(WT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
      const data = await r.json().catch(() => ({}));
      if (r.ok && !data.error && data.result) return data;
      const msg = data.error || ('Errore del server (' + r.status + ')');
      if (i < 1 && (/high demand|overloaded|unavailable|try again|rate|quota|429|503/i.test(msg) || r.status >= 500 || r.status === 429)) { onRetry && onRetry(i + 1); await new Promise(z => setTimeout(z, 3000)); continue; }
      throw new Error(msg);
    } catch (e) { if (i >= 1 || !/fetch|network/i.test(e.message)) throw e; onRetry && onRetry(i + 1); await new Promise(z => setTimeout(z, 3000)); }
  }
}
function wtMsg(m) { return /high demand|overloaded|unavailable|try again|rate|quota|429|503/i.test(m) ? 'Il servizio di correzione in questo momento è molto occupato. Il tuo testo non è perso: riprova tra qualche minuto.' : 'Errore durante la richiesta: ' + m; }
function wtWords(s) { return s.trim() ? s.trim().split(/\s+/).length : 0; }
function renderWriting(t, p, sp) {
  let h = '';
  if (sp.choice && p.items.length > 1) {
    h += '<div class="wt-choice">' + p.items.map((it, i) => `<label class="pill"><input type="radio" name="wtpick" value="${i}" ${i === 0 ? 'checked' : ''}><span>Question ${it.n} · ${it.kind === 'letter' ? 'Letter' : 'Story'}</span></label>`).join('') + '</div>';
  }
  p.items.forEach((it, i) => {
    h += `<div class="wt-item" data-i="${i}" ${i ? 'style="display:none"' : ''}>
      <div class="textbox"><h3>Question ${it.n}</h3>${paras(it.task)}</div>
      <textarea class="wt-area" id="wt-text-${i}" placeholder="Write your text here…"></textarea>
      <div class="wt-meta"><span id="wt-count-${i}">Parole: 0</span><span>Target: ${WT_INFO[it.kind].target}</span></div>
      <div class="wt-ver">versione tutor: 2 ott 17:15</div>
      <button class="btn btn-red wt-go" data-i="${i}">✔ Valuta il mio Writing</button>
      <div class="wt-err" id="wt-err-${i}"></div><div class="wt-res" id="wt-res-${i}"></div>
    </div>`;
  });
  return h;
}
function initWriting(p) {
  document.querySelectorAll('input[name="wtpick"]').forEach(r => r.onchange = () =>
    document.querySelectorAll('.wt-item').forEach(d => d.style.display = d.dataset.i === r.value ? '' : 'none'));
  p.items.forEach((it, i) => {
    const ta = document.getElementById('wt-text-' + i), cnt = document.getElementById('wt-count-' + i), info = WT_INFO[it.kind];
    ta.oninput = () => { const n = wtWords(ta.value); cnt.textContent = 'Parole: ' + n; cnt.style.color = n && (n < info.min || n > info.max) ? '#ff6666' : ''; };
  });
  document.querySelectorAll('.wt-go').forEach(b => b.onclick = () => runWT(p.items[+b.dataset.i], +b.dataset.i, b));
}
async function runWT(it, i, btn) {
  const text = document.getElementById('wt-text-' + i).value.trim(), err = document.getElementById('wt-err-' + i), res = document.getElementById('wt-res-' + i);
  const info = WT_INFO[it.kind], pts = it.points && it.points.length ? it.points : null;
  err.style.display = 'none'; res.style.display = 'none';
  if (!text) { err.textContent = 'Scrivi il tuo testo prima di chiedere la valutazione.'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Analisi in corso…';
  const prompt = `Sei un esaminatore ufficiale Cambridge B1 Preliminary (PET for Schools). Lo studente è un adolescente italiano di livello B1.
Rispondi in italiano, citando tra virgolette le frasi originali in inglese quando correggi.

Tipologia di task: ${info.name}
Lunghezza richiesta: ${info.target}. Il testo dello studente ha ${wtWords(text)} parole.
Consegna: ${it.task}
${pts ? 'Punti di contenuto obbligatori:\n- ' + pts.join('\n- ') : ''}

${WT_SCALES[info.scale]}

Rispondi SOLO con queste tre parti, come nei commenti d'esame Cambridge, in tutto al massimo 70 parole:
EXAMINER COMMENTS
${info.scale === 'p2' ? 'Una o due frasi in italiano: quali punti della consegna sono stati trattati bene e quale manca o è trattato solo in parte, e se il messaggio arriva al lettore.' : 'Una o due frasi in italiano sul testo nel suo insieme: effetto sul lettore, varietà e ambizione della lingua (con un esempio citato), connettivi e organizzazione, gravità degli errori.'}
MARK: X/5
CORREZIONI
Al massimo 4 errori di grammatica o di lessico, una riga ciascuno nel formato: "frase sbagliata" → forma corretta.
Nient'altro: niente consigli, niente introduzioni, niente saluti. Non riscrivere il testo.

Testo dello studente:
"""
${text}
"""`;
  try {
    const data = await wtCall(prompt, n => { btn.textContent = 'Server occupato, riprovo…'; });
    res.innerHTML = data.result; res.style.display = 'block';
  } catch (e) { err.textContent = wtMsg(e.message); err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = '✔ Valuta il mio Writing'; }
}

/* ---------- rendering delle parti ---------- */
function renderPart(t, sec, p) {
  const sp = spec(t, sec, p), type = sp.type;
  let h = '';
  if (sec === 'listening' && (type !== 'mcaudio' || p.audio)) {
    if (p.intro) h += `<div class="q-context" style="font-size:1rem">${esc(p.intro)}</div>`;
    h += audioHTML('main', p.audio);
  }
  if (type === 'notices') {
    p.items.forEach(it => {
      const box = it.img ? `<div class="notice"><img src="${esc(it.img)}" alt="" style="max-width:100%"></div>` : `<div class="notice">${esc(it.text || '')}</div>`;
      h += mcQuestion(it.n, it.q, it.options, it.answer, box);
    });
  } else if (type === 'match') {
    h += '<div class="two-col"><div>';
    p.people.forEach(pp => {
      keys.push({ n: pp.n, kind: 'select', type: 'letter', v: pp.answer, box: true });
      let o = '<option value="">—</option>'; p.texts.forEach(tx => o += `<option value="${tx.letter}">${tx.letter}</option>`);
      h += `<div class="q" id="q-${pp.n}"><div class="q-head"><span class="q-num">${pp.n}</span>${esc(pp.name)}</div>
        <div style="line-height:1.5;margin-bottom:8px">${esc(pp.text)}</div>
        <span class="gapwrap" id="g-${pp.n}">Testo: <select id="in-${pp.n}">${o}</select></span><div class="fb" id="fb-${pp.n}"></div></div>`;
    });
    h += '</div><div>';
    p.texts.forEach(tx => { h += `<div class="mtext"><b>${tx.letter}</b><strong>${esc(tx.title || '')}</strong>${paras(tx.text)}</div>`; });
    h += '</div></div>';
  } else if (type === 'truefalse') {
    const labels = p.labels || sp.labels || ['Correct', 'Incorrect'];
    let qs = ''; p.items.forEach(it => { qs += mcQuestion(it.n, it.q, labels, it.answer); });
    h += p.text ? `<div class="longwrap"><div class="textcol">${titleBox(p, paras(p.text))}</div><div>${qs}</div></div>` : qs;
  } else if (type === 'mclong') {
    let qs = ''; p.items.forEach(it => { qs += mcQuestion(it.n, it.q, it.options, it.answer); });
    h += p.text ? `<div class="longwrap"><div class="textcol">${titleBox(p, paras(p.text))}</div><div>${qs}</div></div>` : qs;
  } else if (type === 'gapped') {
    const letters = p.options.map(o => o.letter);
    h += `<div class="longwrap"><div class="textcol">${titleBox(p, paras(p.text, n => selectGap(n, letters, p.answers[n])))}</div>
      <div class="optlist">${p.options.map(o => `<div><b>${o.letter}</b> ${esc(o.text)}</div>`).join('')}</div></div>`;
  } else if (type === 'mccloze') {
    h += titleBox(p, paras(p.text, n => { const g = p.gaps[n]; return g ? selectGap(n, g.options.map((_, i) => L[i]), g.answer, g.options) : '[' + n + ']'; }));
  } else if (type === 'opencloze') {
    h += titleBox(p, paras(p.text, n => textGap(n, p.answers[n])));
  } else if (type === 'transform') {
    if (p.title) h += `<div class="q-context" style="font-size:1rem">${esc(p.title)}</div>`;
    p.items.forEach(it => {
      keys.push({ n: it.n, kind: 'text', type: 'text', v: it.answers || [], box: true });
      h += `<div class="q" id="q-${it.n}"><div class="q-head"><span class="q-num">${it.n}</span>${esc(it.first)}</div>
        <div class="tf-line">${esc(it.before || '')} <span class="gapwrap" id="g-${it.n}"><input class="gap" id="in-${it.n}" autocomplete="off" spellcheck="false"></span> ${esc(it.after || '')}</div>
        <div class="fb" id="fb-${it.n}"></div></div>`;
    });
  } else if (type === 'mcaudio') {
    p.items.forEach(it => {
      const extra = (it.context ? `<div class="q-context">${esc(it.context)}</div>` : '') + audioHTML('a' + it.n, it.audio);
      h += mcQuestion(it.n, it.q, it.options, it.answer, extra, it.img ? `<img class="qimg" src="${esc(it.img)}" alt="">` : '');
    });
  } else if (type === 'notes') {
    h += titleBox(p, paras(p.notes, n => textGap(n, p.answers[n])));
  } else if (type === 'writetask') {
    h += renderWriting(t, p, sp);
  }
  return h;
}

function showPart(ti, sec, pi) {
  stopAudio(); window.scrollTo(0, 0);
  checked = false; plays = {}; audioReg = {}; keys = [];
  const t = TESTS[ti], p = t[sec][pi], sp = spec(t, sec, p);
  cur = { ti, sec, pi, t, p };
  const col = sec === 'reading' ? 'cyan' : sec === 'writing' ? 'red' : 'green';
  let h = `<div class="sec-${sec}"><div class="topbar"><button class="btn btn-ghost" onclick="go('${t.id}')">← ${esc(t.title)}</button></div>
    <div class="block-title bt-${col}">${SEC_NAME[sec]} · Part ${p.part}</div>
    <div class="rubric"><div class="en">${esc(p.rubric || sp.en)}</div><div class="it">💡 ${esc(sp.it)}</div></div>`;
  h += renderPart(t, sec, p);
  const nx = nextPart(t, sec, pi);
  const nextBtn = nx ? `<button class="btn btn-green" onclick="go('${t.id}/${nx[0]}/${nx[1]}')">Parte successiva →</button>` : `<button class="btn btn-ghost" onclick="go('${t.id}')">Torna al test</button>`;
  if (sp.type === 'writetask') { app.innerHTML = h + `<div class="resultbar">${nextBtn}</div></div>`; initWriting(p); return; }
  h += `<div class="resultbar"><button class="btn btn-red" id="checkBtn" onclick="checkPart()">✔ Correggi</button>
    <span class="score" id="scoreOut"></span>
    <button class="btn btn-ghost" id="retryBtn" style="display:none" onclick="showPart(${ti},'${sec}',${pi})">↻ Riprova</button>
    <span id="nextWrap" style="display:none">${nextBtn}</span></div></div>`;
  app.innerHTML = h;
}

/* ---------- correzione ---------- */
function checkPart() {
  let score = 0;
  keys.forEach(k => {
    let given = '';
    if (k.kind === 'radio') { const r = document.querySelector(`input[name="r-${k.n}"]:checked`); given = r ? r.value : ''; }
    else given = document.getElementById('in-' + k.n).value;
    const ok = k.type === 'text' ? norm(given) !== '' && k.v.some(a => norm(a) === norm(given)) : given !== '' && given === k.v;
    if (ok) score++;
    const gw = document.getElementById('g-' + k.n), qb = document.getElementById('q-' + k.n);
    if (gw) gw.classList.add(ok ? 'ok' : 'ko');
    if (qb) qb.classList.add(ok ? 'ok' : 'ko');
    const fb = document.getElementById('fb-' + k.n);
    if (fb) {
      const sol = k.type === 'text' ? (k.v[0] || '?') : (k.v || '?') + (k.label ? ' (' + k.label + ')' : '');
      if (k.box) fb.textContent = ok ? '✓ Corretto' : '✗ Risposta corretta: ' + sol;
      else fb.textContent = ok ? '✓' : '→ ' + sol;
      fb.style.color = ok ? '#00a83a' : '#e00000';
    }
  });
  document.querySelectorAll('#app input, #app select').forEach(el => el.disabled = true);
  checked = true;
  Object.keys(audioReg).forEach(refreshAudio);
  const tot = keys.length;
  document.getElementById('scoreOut').textContent = `${score}/${tot}`;
  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('retryBtn').style.display = 'inline-block';
  const nw = document.getElementById('nextWrap'); if (nw) nw.style.display = 'inline';
  storeBest(`${cur.t.id}|${cur.sec}|${cur.p.part}`, score, tot);
}

/* ---------- navigazione con indirizzo: indietro del browser e ricarica tornano allo stesso punto ----------
   #pet1-t1                  = pagina del test
   #pet1-t1/reading/3        = una parte del test
   b1-preliminary.html?test=pet1-t1 = link diretto dalla pagina I */
function nextPart(t, sec, pi) {
  const list = [];
  SECTIONS.forEach(([s]) => readyParts(t, s).forEach(p => list.push([s, p.part])));
  const i = list.findIndex(([s, n]) => s === sec && n === t[sec][pi].part);
  return i >= 0 && i < list.length - 1 ? list[i + 1] : null;
}
function go(hash) {
  if (('#' + hash) === location.hash || (!hash && !location.hash)) route();
  else location.hash = hash;
}
function route() {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ''));
  const [id, sec, part] = hash ? hash.split('/') : [new URLSearchParams(location.search).get('test')];
  const ti = TESTS.findIndex(t => t.id === id);
  if (ti < 0) return showHome();
  const t = TESTS[ti];
  if (t.src && !t.loaded) { app.innerHTML = '<div class="empty-note">Caricamento…</div>'; return loadTest(t, route); }
  if (sec && t[sec]) {
    const pi = t[sec].findIndex(p => String(p.part) === String(part));
    if (pi >= 0) return showPart(ti, sec, pi);
  }
  showTest(ti);
}
window.addEventListener('hashchange', route);
route();
</script>
